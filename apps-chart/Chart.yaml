apiVersion: v2
name: rkd-apps-chart
description: A comprehensive Helm chart for deploying multiple self-hosted applications including media servers, productivity tools, development utilities, and monitoring solutions.
type: application
version: 0.3.3
appVersion: "1.0"
keywords:
  - self-hosted
  - media-server
  - productivity
  - monitoring
  - development
  - home-automation
maintainers:
  - name: rkd
    email: a@rkd.pw
sources:
  - https://github.com/ilvar/rkd-compose/tree/main/apps-chart
icon: https://raw.githubusercontent.com/kubernetes/kubernetes/master/logo/logo.png
annotations:
  catalog.cattle.io/display-name: "RKD Applications Chart"
  catalog.cattle.io/certified: "false"
  catalog.cattle.io/namespace: "default"
  catalog.cattle.io/release-name: "rkd-apps-chart"
dependencies:
  - name: reloader
    version: "2.2.16"
    repository: "https://stakater.github.io/stakater-charts"
  - name: headlamp
    version: "0.40.0"
    repository: "https://kubernetes-sigs.github.io/headlamp/"
  - name: velero
    version: "11.4.0"
    repository: "https://vmware-tanzu.github.io/helm-charts"
  - name: velero-ui
    version: "0.14.0"
    repository: "https://helm.otwld.com/"
  - name: descheduler
    version: "0.35.0"
    repository: "https://kubernetes-sigs.github.io/descheduler/"
  - name: glacier
    version: "0.1.0"
    repository: "oci://ghcr.io/ilvar/charts"
    condition: glacier.enabled
