apiVersion: v2
name: rkd-apps-chart
description: A comprehensive Helm chart for deploying multiple self-hosted applications including media servers, productivity tools, development utilities, and monitoring solutions.
type: application
version: 0.1.48
appVersion: "1.0"
keywords:
  - self-hosted
  - media-server
  - productivity
  - monitoring
  - development
  - home-automation
maintainers:
  - name: rkd
    email: a@rkd.pw
sources:
  - https://github.com/rkd-pw/rkd-apps-chart
icon: https://raw.githubusercontent.com/kubernetes/kubernetes/master/logo/logo.png
annotations:
  catalog.cattle.io/display-name: "RKD Applications Chart"
  catalog.cattle.io/certified: "false"
  catalog.cattle.io/namespace: "default"
  catalog.cattle.io/release-name: "rkd-apps-chart"
dependencies:
  - name: reloader
    version: "2.2.7"
    repository: "https://stakater.github.io/stakater-charts"
  - name: jitsi-meet
    version: "2.1.3"
    repository: "https://jitsi-contrib.github.io/jitsi-helm/"

