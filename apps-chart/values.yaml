backups:
  enabled: true
  serviceAccountName: backup
  backblaze:
    enabled: true
    bucket: homelab-rancher-backup
    secretName: backblaze-credentials
    accountIdKey: account-id
    applicationKeyKey: application-key
    resticPasswordKey: restic-password
  etcd:
    enabled: true
    schedule: "0 3 * * *"
    image:
      repository: alpine
      tag: latest
    endpoints: "https://127.0.0.1:2379"
    ca: "/var/lib/rancher/k3s/server/tls/etcd/server-ca.crt"
    cert: "/var/lib/rancher/k3s/server/tls/etcd/server-client.crt"
    key: "/var/lib/rancher/k3s/server/tls/etcd/server-client.key"
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 200m
  postgres:
    enabled: true
    image:
      repository: postgres
      tag: 18-alpine
    databases:
    - name: immich
      host: immich-database
      port: 5432
      user: postgres
      database: immich
      secretName: immich-secrets
      passwordKey: postgres-password
      schedule: "0 4 * * *"
    - name: miniflux
      host: miniflux-db
      port: 5432
      user: miniflux
      database: miniflux
      secretName: miniflux-db-secrets
      passwordKey: postgres-password
      schedule: "0 4 * * *"
    - name: kosmos
      host: kosmos-db
      port: 5432
      user: postgres
      database: crm
      secretName: kosmos-secrets
      passwordKey: postgres-password
      schedule: "0 4 * * *"
    - name: bugsink
      host: bugsink-db
      port: 5432
      user: bugsink
      database: bugsink
      secretName: bugsink-db-secrets
      passwordKey: postgres-password
      schedule: "0 4 * * *"
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 200m
  mysql:
    enabled: true
    image:
      repository: alpine
      tag: latest
    databases: []
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 200m
  meilisearch:
    enabled: true
    image:
      repository: alpine
      tag: latest
    instances:
    - name: hoarder
      host: hoarder-meilisearch
      port: 7700
      masterKeySecret:
        name: hoarder-secrets
        key: meili-master-key
      schedule: "0 6 * * *"
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 200m
  redis:
    enabled: true
    image:
      repository: redis
      tag: 8.6-alpine
    instances:
    - name: paperless
      host: paperless-redis
      port: 6379
      password: false
      schedule: "0 7 * * *"
    - name: immich
      host: immich-redis
      port: 6379
      password: false
      schedule: "0 7 * * *"
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 200m
  immichData:
    enabled: true
    schedule: "0 9 * * *"
    sourcePath: /home/rkd/.docker/immich/upload
    pvcName: immich-upload-local
    image:
      repository: alpine
      tag: latest
    transfers: 4
    checkers: 8
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: immich-server
          topologyKey: kubernetes.io/hostname
    resources:
      limits:
        memory: 2Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 500m
  cleanup:
    enabled: true
    schedule: "0 8 * * *"
    image:
      repository: alpine
      tag: latest
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 200m
  beszel:
    enabled: true
    schedule: "0 4 * * *"
  zigbee2mqtt:
    enabled: true
    schedule: "0 5 * * *"
  bugsink:
    enabled: true
    schedule: "0 4 * * *"
  hoarder:
    enabled: true
    schedule: "0 6 * * *"
velero:
  enabled: true
  deployNodeAgent: true
  podAnnotations:
    backup.velero.io/backup-volumes-excludes: plugins,scratch
  nodeAgent:
    tolerations:
    - key: dedicated
      operator: Equal
      value: blocky
      effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  credentials:
    existingSecret: velero-b2-credentials
  configuration:
    uploaderType: kopia
    volumeSnapshotLocation: []
    backupStorageLocation:
    - name: default
      provider: aws
      bucket: homelab-rancher-backup
      prefix: velero
      config:
        region: us-west-004
        s3Url: https://s3.us-west-004.backblazeb2.com
        s3ForcePathStyle: "true"
        checksumAlgorithm: ""
  kubectl:
    image:
      repository: docker.io/bitnamilegacy/kubectl
      tag: "1.33"
  initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.13.2
    volumeMounts:
    - mountPath: /target
      name: plugins
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  schedules:
    daily-backup:
      disabled: false
      schedule: "0 2 * * *"
      template:
        ttl: 720h0m0s
        defaultVolumesToFsBackup: true
        includedNamespaces:
        - default
velero-ui:
  enabled: true
  configuration:
    general:
      veleroNamespace: default
  extraEnv:
  - name: BASIC_AUTH_ENABLED
    value: "true"
  - name: BASIC_AUTH_USER
    value: "admin"
  - name: BASIC_AUTH_PASSWORD
    value: "admin"
  ingress:
    enabled: true
    className: traefik
    hosts:
    - host: velero.h.rkd.pw
      paths:
      - path: /
        pathType: Prefix
    - host: velero.k.rkd.pw
      paths:
      - path: /
        pathType: Prefix
    tls:
    - hosts:
      - velero.h.rkd.pw
      - velero.k.rkd.pw
      secretName: homelab-wildcard-h-tls
descheduler:
  enabled: true
  kind: Deployment
  schedule: "*/10 * * * *"
  tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "blocky"
    effect: "NoSchedule"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: kubernetes.io/arch
            operator: In
            values:
            - arm64
            - amd64
  deschedulerPolicy:
    profiles:
    - name: default
      pluginConfig:
      - name: LowNodeUtilization
        args:
          thresholds:
            memory: 20
          targetThresholds:
            memory: 50
      - name: RemoveDuplicates
        args: {}
      - name: RemovePodsViolatingNodeAffinity
        args:
          nodeAffinityType:
          - requiredDuringSchedulingIgnoredDuringExecution
      plugins:
        balance:
          enabled:
          - LowNodeUtilization
          - RemoveDuplicates
        deschedule:
          enabled:
          - RemovePodsViolatingNodeAffinity
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
parrot:
  enabled: true
  image:
    repository: ilvar/parrot
    tag: 0.1.0
  resources:
    limits:
      memory: 128Mi
    requests:
      memory: 64Mi
      cpu: 100m
  storage:
    data: parrot-data
  ingress:
    enabled: true
    hosts:
    - parrot.h.rkd.pw
    servicePort: 8080
