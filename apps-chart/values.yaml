paperless:
  enabled: true
  webserver:
    image:
      repository: ghcr.io/paperless-ngx/paperless-ngx
      tag: latest
    environment:
      PAPERLESS_OCR_LANGUAGES: eng
      TZ: Europe/Dublin
      PAPERLESS_USE_SSL: "false"
      PAPERLESS_FORGIVING_OCR: "true"
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_OCR_MODE: skip
      PAPERLESS_CONSUMER_DISABLE: "true"
      PAPERLESS_WEBSERVER_WORKERS: 4
      PAPERLESS_URL: https://docs.h.rkd.pw
      USE_X_FORWARD_HOST: "true"
      USE_X_FORWARD_PORT: "true"
  secrets:
    secretKey: ilvar
    storage:
      data: paperless-data
      media: paperless-media
      export: paperless-export
      consume: paperless-consume
  redis:
    image:
      repository: redis
      tag: "6.0"
  ingress:
    enabled: true
    hosts:
      - docs.h.rkd.pw
      - d.h.rkd.pw
      - docs.z85
    servicePort: 8000

