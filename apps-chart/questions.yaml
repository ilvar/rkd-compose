categories:
- Infrastructure
- Media
- Productivity
- Development

questions:
- variable: blocky.enabled
  label: "Enable Blocky DNS"
  description: "DNS server with ad-blocking capabilities"
  type: boolean
  default: true
  group: "DNS & Networking"

- variable: blocky.timezone
  label: "Blocky Timezone"
  description: "Timezone for Blocky"
  type: string
  default: "Europe/Dublin"
  group: "DNS & Networking"

- variable: portainer.enabled
  label: "Enable Portainer"
  description: "Container management UI"
  type: boolean
  default: true
  group: "Management"

- variable: portainer.ingress.hosts[0]
  label: "Portainer Host"
  description: "Hostname for Portainer (e.g., portainer.h.rkd.pw)"
  type: string
  default: "portainer.h.rkd.pw"
  group: "Management"

- variable: jellyfin.enabled
  label: "Enable Jellyfin"
  description: "Media server"
  type: boolean
  default: true
  group: "Media"

- variable: jellyfin.ingress.hosts[0]
  label: "Jellyfin Primary Host"
  description: "Primary hostname for Jellyfin"
  type: string
  default: "jf.h.rkd.pw"
  group: "Media"

- variable: jellyfin.resources.limits.memory
  label: "Jellyfin Memory Limit"
  description: "Memory limit for Jellyfin (e.g., 6Gi)"
  type: string
  default: "6Gi"
  group: "Media"

- variable: jackett.enabled
  label: "Enable Jackett"
  description: "Torrent indexer"
  type: boolean
  default: true
  group: "Media"

- variable: jackett.ingress.hosts[0]
  label: "Jackett Host"
  description: "Hostname for Jackett"
  type: string
  default: "jackett.h.rkd.pw"
  group: "Media"

- variable: radarr.enabled
  label: "Enable Radarr"
  description: "Movie collection manager"
  type: boolean
  default: true
  group: "Media"

- variable: radarr.ingress.hosts[0]
  label: "Radarr Host"
  description: "Hostname for Radarr"
  type: string
  default: "radarr.h.rkd.pw"
  group: "Media"

- variable: deluge.enabled
  label: "Enable Deluge"
  description: "BitTorrent client"
  type: boolean
  default: true
  group: "Media"

- variable: deluge.ingress.hosts[0]
  label: "Deluge Host"
  description: "Hostname for Deluge"
  type: string
  default: "deluge.h.rkd.pw"
