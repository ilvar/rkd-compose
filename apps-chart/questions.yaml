  default: true
  group: "Home Automation"

- variable: homeassistant.ingress.hosts[0]
  label: "Home Assistant Host"
  description: "Hostname for Home Assistant"
  type: string
  default: "ha.h.rkd.pw"
  group: "Home Automation"

- variable: hoarder.enabled
  label: "Enable Hoarder"
  description: "Web scraping and automation tool"
  type: boolean
  default: true
  group: "Productivity"

- variable: hoarder.web.environment.NEXTAUTH_URL
  label: "Hoarder URL"
  description: "Full URL for Hoarder (e.g., https://hoarder.h.rkd.pw)"
