- variable: paperless.enabled
  label: "Enable Paperless"
  description: "Document management system"
  type: boolean
  default: true
  group: "Productivity"

- variable: paperless.webserver.environment.PAPERLESS_URL
  label: "Paperless URL"
  description: "Full URL for Paperless (e.g., https://docs.h.rkd.pw)"
