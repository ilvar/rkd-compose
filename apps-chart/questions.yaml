- variable: nextcloud.secrets.mysqlRootPassword
  label: "Nextcloud MySQL Root Password"
  description: "Root password for Nextcloud MySQL database"
  type: password
  default: "nextcloud"
  group: "Productivity"

- variable: kuma.enabled
  label: "Enable Uptime Kuma"
