{{- if .Values.longhorn.requirementsCheck.enabled }}
---
# DaemonSet to check if Longhorn requirements are met on all nodes
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: longhorn-requirements-check
  namespace: longhorn-system
  labels:
    app: longhorn-requirements-check
spec:
  selector:
    matchLabels:
      app: longhorn-requirements-check
  template:
    metadata:
      labels:
        app: longhorn-requirements-check
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: check
        image: {{ .Values.longhorn.requirementsCheck.image.repository }}:{{ .Values.longhorn.requirementsCheck.image.tag }}
        securityContext:
          privileged: true
        command:
        - /bin/sh
        - -c
        - |
          echo "Checking Longhorn requirements on node: $(hostname)"
          echo "=========================================="
          
          # Check for iscsiadm
          echo -n "Checking iscsiadm... "
          if nsenter --mount=/host/proc/1/ns/mnt --net=/host/proc/1/ns/net which iscsiadm &> /dev/null; then
            echo "✓ Found"
            nsenter --mount=/host/proc/1/ns/mnt --net=/host/proc/1/ns/net iscsiadm --version || true
          else
            echo "✗ NOT FOUND"
            echo "  ERROR: iscsiadm is required but not found on the host!"
            echo "  Please install open-iscsi on this node."
            exit 1
          fi
          
          # Check for iscsid service
          echo -n "Checking iscsid service... "
          if nsenter --mount=/host/proc/1/ns/mnt --net=/host/proc/1/ns/net systemctl is-active --quiet iscsid 2>/dev/null; then
            echo "✓ Running"
          else
            echo "⚠ Not running (may be OK if using alternative method)"
          fi
          
          # Check for iscsi_tcp module
          echo -n "Checking iscsi_tcp kernel module... "
          if nsenter --mount=/host/proc/1/ns/mnt lsmod | grep -q iscsi_tcp; then
            echo "✓ Loaded"
          else
            echo "⚠ Not loaded (will be loaded automatically if needed)"
          fi
          
          # Check for required utilities
          echo "Checking required utilities..."
          for util in bash curl findmnt grep awk blkid lsblk; do
            if nsenter --mount=/host/proc/1/ns/mnt --net=/host/proc/1/ns/net which $util &> /dev/null; then
              echo "  ✓ $util"
            else
              echo "  ✗ $util - MISSING"
            fi
          done
          
          echo ""
          echo "=========================================="
          echo "Requirements check completed for node: $(hostname)"
          echo "If all checks pass, Longhorn should work on this node."
        volumeMounts:
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
      volumes:
      - name: host-proc
        hostPath:
          path: /proc
          type: Directory
      tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
{{- end }}
