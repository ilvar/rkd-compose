{{- if .Values.velero.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: velero-b2-credentials
  labels:
    app: velero
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id={{ .Values.velero.secrets.b2AccountId }}
    aws_secret_access_key={{ .Values.velero.secrets.b2ApplicationKey }}
{{- end }}
