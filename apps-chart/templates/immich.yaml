{{- if .Values.immich.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: immich-secrets
  labels:
    app: immich
type: Opaque
stringData:
  db-password: {{ .Values.immich.secrets.dbPassword | default "postgres" | quote }}
  postgres-password: {{ .Values.immich.secrets.postgresPassword | default "postgres" | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-database
  labels:
    app: immich-database
spec:
  serviceName: immich-database
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: immich-database
  template:
    metadata:
      labels:
        app: immich-database
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      initContainers:
      - name: postgres-upgrade
        image: tianon/postgres-upgrade:14-to-15
        command:
        - /bin/bash
        - -c
        - |
          set -e
          OLD_DATA="/var/lib/postgresql/14/data"
          NEW_DATA="/var/lib/postgresql/15/data"
          DATA_DIR="/var/lib/postgresql/data"
          
          # Check if data directory exists and has data
          if [ ! -d "$DATA_DIR" ] || [ -z "$(ls -A $DATA_DIR 2>/dev/null)" ]; then
            echo "No existing data directory found. Skipping upgrade."
            exit 0
          fi
          
          # Check PostgreSQL version
          if [ ! -f "$DATA_DIR/PG_VERSION" ]; then
            echo "No PG_VERSION file found. Skipping upgrade."
            exit 0
          fi
          
          OLD_VERSION=$(cat "$DATA_DIR/PG_VERSION")
          echo "Found PostgreSQL version: $OLD_VERSION"
          
          # If already version 15, no upgrade needed
          if [ "$OLD_VERSION" = "15" ]; then
            echo "Database is already PostgreSQL 15. No upgrade needed."
            exit 0
          fi
          
          # Only upgrade from 14 to 15
          if [ "$OLD_VERSION" != "14" ]; then
            echo "ERROR: Cannot automatically upgrade from PostgreSQL $OLD_VERSION to 15."
            echo "Automatic upgrade is only supported from PostgreSQL 14 to 15."
            exit 1
          fi
          
          echo "Starting automatic PostgreSQL 14 to 15 upgrade using pg_upgrade..."
          
          # Step 1: Backup existing data to host path
          BACKUP_DIR="/backup/postgres-backup-pg14-$(date +%Y%m%d-%H%M%S)"
          echo "Step 1: Backing up PostgreSQL 14 data to $BACKUP_DIR..."
          mkdir -p "$BACKUP_DIR"
          
          # Create a full backup of the data directory
          echo "Creating backup of PostgreSQL 14 data directory..."
          cp -a "$DATA_DIR"/* "$BACKUP_DIR/" 2>/dev/null || true
          cp -a "$DATA_DIR"/.[!.]* "$BACKUP_DIR/" 2>/dev/null || true
          cp -a "$DATA_DIR"/..?* "$BACKUP_DIR/" 2>/dev/null || true
          
          # Verify backup was created
          if [ -z "$(ls -A $BACKUP_DIR 2>/dev/null)" ]; then
            echo "WARNING: Backup directory is empty. Continuing anyway..."
          else
            echo "Backup completed successfully. Backup location: $BACKUP_DIR"
            # Create a symlink to latest backup for easy access
            LATEST_BACKUP="/backup/postgres-backup-pg14-latest"
            rm -f "$LATEST_BACKUP" 2>/dev/null || true
            ln -s "$(basename $BACKUP_DIR)" "$LATEST_BACKUP" 2>/dev/null || true
          fi
          
          # Step 2: Create directories for pg_upgrade in temp space
          echo "Step 2: Preparing pg_upgrade directories..."
          UPGRADE_DIR="/tmp/pg_upgrade"
          mkdir -p "$UPGRADE_DIR"
          OLD_DATA="$UPGRADE_DIR/14/data"
          NEW_DATA="$UPGRADE_DIR/15/data"
          mkdir -p "$OLD_DATA" "$NEW_DATA"
          
          # Copy existing data to old data location (pg_upgrade expects specific paths)
          echo "Copying data for pg_upgrade..."
          cp -a "$DATA_DIR"/* "$OLD_DATA/" 2>/dev/null || true
          cp -a "$DATA_DIR"/.[!.]* "$OLD_DATA/" 2>/dev/null || true
          cp -a "$DATA_DIR"/..?* "$OLD_DATA/" 2>/dev/null || true
          
          # Initialize new PostgreSQL 15 data directory
          echo "Initializing PostgreSQL 15 data directory..."
          initdb -D "$NEW_DATA" -U postgres --data-checksums || {
            echo "ERROR: Failed to initialize PostgreSQL 15 data directory"
            exit 1
          }
          
          # Run pg_upgrade
          echo "Running pg_upgrade check..."
          pg_upgrade \
            --old-datadir="$OLD_DATA" \
            --new-datadir="$NEW_DATA" \
            --old-bindir=/usr/lib/postgresql/14/bin \
            --new-bindir=/usr/lib/postgresql/15/bin \
            --old-options="--data-checksums" \
            --new-options="--data-checksums" \
            --check || {
            echo "ERROR: pg_upgrade check failed"
            exit 1
          }
          
          echo "pg_upgrade check passed. Running actual upgrade..."
          pg_upgrade \
            --old-datadir="$OLD_DATA" \
            --new-datadir="$NEW_DATA" \
            --old-bindir=/usr/lib/postgresql/14/bin \
            --new-bindir=/usr/lib/postgresql/15/bin \
            --old-options="--data-checksums" \
            --new-options="--data-checksums" || {
            echo "ERROR: pg_upgrade failed"
            exit 1
          }
          
          # Move new data to main location (replacing old data)
          echo "Upgrade completed successfully. Moving upgraded data to main location..."
          rm -rf "$DATA_DIR"/* "$DATA_DIR"/.[!.]* "$DATA_DIR"/..?* 2>/dev/null || true
          cp -a "$NEW_DATA"/* "$DATA_DIR/" 2>/dev/null || true
          cp -a "$NEW_DATA"/.[!.]* "$DATA_DIR/" 2>/dev/null || true
          cp -a "$NEW_DATA"/..?* "$DATA_DIR/" 2>/dev/null || true
          
          echo "PostgreSQL 14 to 15 upgrade completed successfully!"
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: backup
          mountPath: /backup
        - name: upgrade-tmp
          mountPath: /tmp
      containers:
      - name: immich-database
        image: "{{ .Values.immich.database.image.repository }}:{{ .Values.immich.database.image.tag }}"
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-secrets
              key: postgres-password
        - name: POSTGRES_USER
          value: {{ .Values.immich.database.environment.POSTGRES_USER | quote }}
        - name: POSTGRES_DB
          value: {{ .Values.immich.database.environment.POSTGRES_DB | quote }}
        - name: POSTGRES_INITDB_ARGS
          value: {{ .Values.immich.database.environment.POSTGRES_INITDB_ARGS | quote }}
        resources:
          {{- if .Values.immich.database.resources }}
          {{- toYaml .Values.immich.database.resources | nindent 10 }}
          {{- end }}
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - {{ .Values.immich.database.environment.POSTGRES_USER | quote }}
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - {{ .Values.immich.database.environment.POSTGRES_USER | quote }}
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        hostPath:
          path: {{ .Values.immich.database.storage.hostPath | quote }}
          type: DirectoryOrCreate
      - name: backup
        hostPath:
          path: {{ printf "%s-backup" .Values.immich.database.storage.hostPath | quote }}
          type: DirectoryOrCreate
      - name: upgrade-tmp
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  labels:
    app: immich-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      containers:
      - name: immich-redis
        image: "{{ .Values.immich.redis.image.repository }}:{{ .Values.immich.redis.image.tag }}@{{ .Values.immich.redis.image.digest }}"
        resources:
          {{- if .Values.immich.redis.resources }}
          {{- toYaml .Values.immich.redis.resources | nindent 10 }}
          {{- end }}
        ports:
        - containerPort: 6379
          protocol: TCP
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  labels:
    app: immich-machine-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      containers:
      - name: immich-machine-learning
        image: "{{ .Values.immich.machineLearning.image.repository }}:{{ .Values.immich.machineLearning.image.tag }}"
        volumeMounts:
        - name: model-cache
          mountPath: /cache
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: {{ .Values.immich.machineLearning.storage.modelCache }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  labels:
    app: immich-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-server
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      containers:
      - name: immich-server
        image: "{{ .Values.immich.server.image.repository }}:{{ .Values.immich.server.image.tag }}"
        env:
        - name: TZ
          value: {{ .Values.immich.server.environment.TZ | quote }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-secrets
              key: db-password
        - name: DB_USERNAME
          value: {{ .Values.immich.server.environment.DB_USERNAME | quote }}
        - name: DB_DATABASE_NAME
          value: {{ .Values.immich.server.environment.DB_DATABASE_NAME | quote }}
        - name: DB_HOSTNAME
          value: {{ .Values.immich.server.environment.DB_HOSTNAME | quote }}
        - name: REDIS_HOSTNAME
          value: {{ .Values.immich.server.environment.REDIS_HOSTNAME | quote }}
        resources:
          {{- if .Values.immich.server.resources }}
          {{- toYaml .Values.immich.server.resources | nindent 10 }}
          {{- end }}
        ports:
        - containerPort: 2283
          protocol: TCP
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
        - name: upload
          mountPath: /usr/src/app/upload
      volumes:
      - name: localtime
        hostPath:
          path: /etc/localtime
          type: File
      - name: upload
        hostPath:
          path: /home/rkd/.docker/immich/upload
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: immich-database
  labels:
    app: immich-database
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: immich-database
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  labels:
    app: immich-redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
  selector:
    app: immich-redis
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  labels:
    app: immich-server
spec:
  ports:
  - port: 2283
    targetPort: 2283
    protocol: TCP
  selector:
    app: immich-server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.immich.machineLearning.storage.modelCache }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
{{- if and .Values.immich.enabled .Values.immich.ingress.enabled (gt (len .Values.immich.ingress.hosts) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  labels:
    app: immich-server
spec:
{{- if gt (len .Values.immich.ingress.hosts) 0 }}
  tls:
  - hosts:
{{- range .Values.immich.ingress.hosts }}
    - {{ . | quote }}
{{- end }}
    secretName: homelab-wildcard-h-tls
{{- end }}
  rules:
  {{- range .Values.immich.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: immich-server
            port:
              number: {{ $.Values.immich.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}
