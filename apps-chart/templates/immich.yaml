{{- if .Values.immich.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: immich-secrets
  labels:
    app: immich
type: Opaque
stringData:
  db-password: {{ .Values.immich.secrets.dbPassword | default "postgres" | quote }}
  postgres-password: {{ .Values.immich.secrets.postgresPassword | default "postgres" | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.immich.server.storage.upload }}
  labels:
    app: immich
    storage-type: longhorn
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-retain
  resources:
    requests:
      storage: {{ .Values.longhornMigration.immich.size | default "50Gi" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-database
  labels:
    app: immich-database
spec:
  serviceName: immich-database
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: immich-database
  template:
    metadata:
      labels:
        app: immich-database
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
{{- include "apps-chart.excludeNodeMatchExpressions" . | nindent 14 }}
      containers:
      - name: immich-database
        image: "{{ .Values.immich.database.image.repository }}:{{ .Values.immich.database.image.tag }}"
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-secrets
              key: postgres-password
        - name: POSTGRES_USER
          value: {{ .Values.immich.database.environment.POSTGRES_USER | quote }}
        - name: POSTGRES_DB
          value: {{ .Values.immich.database.environment.POSTGRES_DB | quote }}
        - name: POSTGRES_INITDB_ARGS
          value: {{ .Values.immich.database.environment.POSTGRES_INITDB_ARGS | quote }}
        resources:
          {{- if .Values.immich.database.resources }}
          {{- toYaml .Values.immich.database.resources | nindent 10 }}
          {{- end }}
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - {{ .Values.immich.database.environment.POSTGRES_USER | quote }}
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - {{ .Values.immich.database.environment.POSTGRES_USER | quote }}
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        hostPath:
          path: {{ .Values.immich.database.storage.hostPath | quote }}
          type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  labels:
    app: immich-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      containers:
      - name: immich-redis
        image: "{{ .Values.immich.redis.image.repository }}:{{ .Values.immich.redis.image.tag }}@{{ .Values.immich.redis.image.digest }}"
        resources:
          {{- if .Values.immich.redis.resources }}
          {{- toYaml .Values.immich.redis.resources | nindent 10 }}
          {{- end }}
        ports:
        - containerPort: 6379
          protocol: TCP
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  labels:
    app: immich-machine-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
{{- include "apps-chart.excludeNodeMatchExpressions" . | nindent 14 }}
      containers:
      - name: immich-machine-learning
        image: "{{ .Values.immich.machineLearning.image.repository }}:{{ .Values.immich.machineLearning.image.tag }}"
        volumeMounts:
        - name: model-cache
          mountPath: /cache
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: {{ .Values.immich.machineLearning.storage.modelCache }}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  labels:
    app: immich-machine-learning
spec:
  ports:
  - port: 3003
    targetPort: 3003
    protocol: TCP
  selector:
    app: immich-machine-learning
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-server
  labels:
    app: immich-server
spec:
  serviceName: immich-server
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
{{- include "apps-chart.excludeNodeMatchExpressions" . | nindent 14 }}
      initContainers:
      - name: init-immich-upload
        image: alpine:3.20
        command:
        - /bin/sh
        - -c
        - |
          set -e
          for dir in backups library profile thumbs encoded-video upload; do
            mkdir -p "/usr/src/app/upload/${dir}"
            touch "/usr/src/app/upload/${dir}/.immich"
          done
        volumeMounts:
        - name: upload
          mountPath: /usr/src/app/upload
      containers:
      - name: immich-server
        image: "{{ .Values.immich.server.image.repository }}:{{ .Values.immich.server.image.tag }}"
        env:
        - name: TZ
          value: {{ .Values.immich.server.environment.TZ | quote }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-secrets
              key: db-password
        - name: DB_USERNAME
          value: {{ .Values.immich.server.environment.DB_USERNAME | quote }}
        - name: DB_DATABASE_NAME
          value: {{ .Values.immich.server.environment.DB_DATABASE_NAME | quote }}
        - name: DB_HOSTNAME
          value: {{ .Values.immich.server.environment.DB_HOSTNAME | quote }}
        - name: REDIS_HOSTNAME
          value: {{ .Values.immich.server.environment.REDIS_HOSTNAME | quote }}
        resources:
          {{- if .Values.immich.server.resources }}
          {{- toYaml .Values.immich.server.resources | nindent 10 }}
          {{- end }}
        ports:
        - containerPort: 2283
          protocol: TCP
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
        - name: upload
          mountPath: /usr/src/app/upload
        {{- if .Values.immich.server.externalLibrary }}
        - name: external-library
          mountPath: {{ .Values.immich.server.externalLibrary.mountPath }}
          readOnly: true
        {{- end }}
      volumes:
      - name: localtime
        hostPath:
          path: /etc/localtime
          type: File
      - name: upload
        persistentVolumeClaim:
          claimName: {{ .Values.immich.server.storage.upload }}
      {{- if .Values.immich.server.externalLibrary }}
      - name: external-library
        hostPath:
          path: {{ .Values.immich.server.externalLibrary.hostPath | quote }}
          type: Directory
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-database
  labels:
    app: immich-database
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: immich-database
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  labels:
    app: immich-redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
  selector:
    app: immich-redis
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  labels:
    app: immich-server
spec:
  ports:
  - port: 2283
    targetPort: 2283
    protocol: TCP
  selector:
    app: immich-server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.immich.machineLearning.storage.modelCache }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
{{- if and .Values.immich.enabled .Values.immich.ingress.enabled (gt (len .Values.immich.ingress.hosts) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  labels:
    app: immich-server
spec:
{{- if gt (len .Values.immich.ingress.hosts) 0 }}
  tls:
  - hosts:
{{- range .Values.immich.ingress.hosts }}
    - {{ . | quote }}
{{- end }}
    secretName: homelab-wildcard-h-tls
{{- end }}
  rules:
  {{- range .Values.immich.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: immich-server
            port:
              number: {{ $.Values.immich.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}
