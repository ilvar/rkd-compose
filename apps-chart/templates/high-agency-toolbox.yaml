{{- if .Values.highAgencyToolbox.enabled }}
{{- if and .Values.highAgencyToolbox.openrouter.enabled (not .Values.highAgencyToolbox.auth.enabled) }}
{{- fail "highAgencyToolbox.auth.enabled must be true when highAgencyToolbox.openrouter.enabled is true for public deployments" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: high-agency-toolbox
  labels:
    app: high-agency-toolbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: high-agency-toolbox
  template:
    metadata:
      labels:
        app: high-agency-toolbox
    spec:
      imagePullSecrets:
        - name: {{ .Values.highAgencyToolbox.imagePullSecret }}
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: high-agency-toolbox
          image: "{{ .Values.highAgencyToolbox.image.repository }}:{{ .Values.highAgencyToolbox.image.tag }}"
          imagePullPolicy: Always
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DATA_DIR
              value: /data
            - name: WEB_DIR
              value: /app/web
            - name: APP_URL
              value: {{ .Values.highAgencyToolbox.appUrl | quote }}
            {{- if .Values.highAgencyToolbox.openrouter.enabled }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "highAgencyToolbox.openrouter.apiKeySecret.name is required" .Values.highAgencyToolbox.openrouter.apiKeySecret.name }}
                  key: {{ required "highAgencyToolbox.openrouter.apiKeySecret.key is required" .Values.highAgencyToolbox.openrouter.apiKeySecret.key }}
            - name: OPENROUTER_MODEL
              value: {{ required "highAgencyToolbox.openrouter.model is required when openrouter.enabled=true" .Values.highAgencyToolbox.openrouter.model | quote }}
            - name: OPENROUTER_BASE_URL
              value: {{ .Values.highAgencyToolbox.openrouter.baseUrl | quote }}
            {{- end }}
            {{- if .Values.highAgencyToolbox.auth.enabled }}
            - name: SUPABASE_URL
              value: {{ required "highAgencyToolbox.auth.supabaseUrl is required when auth.enabled=true" .Values.highAgencyToolbox.auth.supabaseUrl | quote }}
            {{- if .Values.highAgencyToolbox.auth.supabaseInternalUrl }}
            - name: SUPABASE_INTERNAL_URL
              value: {{ .Values.highAgencyToolbox.auth.supabaseInternalUrl | quote }}
            {{- end }}
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "highAgencyToolbox.auth.publishableKeySecret.name is required when auth.enabled=true" .Values.highAgencyToolbox.auth.publishableKeySecret.name }}
                  key: {{ required "highAgencyToolbox.auth.publishableKeySecret.key is required when auth.enabled=true" .Values.highAgencyToolbox.auth.publishableKeySecret.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.highAgencyToolbox.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: high-agency-toolbox-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: high-agency-toolbox
spec:
  selector:
    app: high-agency-toolbox
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: high-agency-toolbox-data
spec:
  storageClassName: local-path-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.highAgencyToolbox.storageSize }}
{{- if .Values.highAgencyToolbox.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: high-agency-toolbox
spec:
  tls:
    - hosts:
        - {{ .Values.highAgencyToolbox.ingress.host | quote }}
      secretName: homelab-wildcard-h-tls
  rules:
    - host: {{ .Values.highAgencyToolbox.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: high-agency-toolbox
                port:
                  number: 8080
{{- end }}
{{- end }}
