{{- if .Values.backups.bugsink.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-bugsink
  labels:
    app: backup-bugsink
spec:
  schedule: {{ .Values.backups.bugsink.schedule | default "0 4 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-bugsink
        spec:
          serviceAccountName: {{ .Values.backups.serviceAccountName | default "backup" }}
          restartPolicy: OnFailure
          containers:
          - name: bugsink-backup
            image: "alpine:latest"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache restic sqlite 2>/dev/null || true

              echo "Backing up bugsink data (SQLite DB, encrypted)..."

              BACKUP_DIR="/tmp/backup"
              mkdir -p "$BACKUP_DIR"

              # Use sqlite3 .backup for consistent copy of all .db files
              for db in /mnt/bugsink-data/*.db; do
                if [ -f "$db" ]; then
                  BASENAME=$(basename "$db")
                  sqlite3 "$db" ".backup '$BACKUP_DIR/$BASENAME'"
                  echo "Backed up $BASENAME"
                fi
              done

              {{- if .Values.backups.backblaze.enabled }}
              # Initialize restic repository if needed
              restic cat config > /dev/null 2>&1 || restic init

              echo "Uploading bugsink backup to B2 via restic (encrypted)..."
              cd $BACKUP_DIR
              restic backup . --host backup-bugsink --compression auto
              {{- end }}

              # Cleanup
              rm -rf "$BACKUP_DIR"

              echo "Bugsink backup completed"
            volumeMounts:
            - name: bugsink-data
              mountPath: /mnt/bugsink-data
              readOnly: true
            env:
            {{- if .Values.backups.backblaze.enabled }}
            - name: B2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: B2_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.resticPasswordKey | default "restic-password" }}
            - name: RESTIC_REPOSITORY
              value: "b2:{{ .Values.backups.backblaze.bucket }}:bugsink"
            {{- end }}
            resources:
              limits:
                memory: 256Mi
                cpu: 200m
              requests:
                memory: 128Mi
                cpu: 100m
          volumes:
          - name: bugsink-data
            persistentVolumeClaim:
              claimName: {{ .Values.bugsink.storage.data }}
{{- end }}

