            emptyDir: {}
{{- end }}
{{- end }}

{{- if .Values.backups.meilisearch.enabled }}
{{- range .Values.backups.meilisearch.instances }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-meilisearch-{{ .name }}
  labels:
    app: backup-meilisearch
    instance: {{ .name }}
spec:
  schedule: {{ .schedule | default "0 6 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-meilisearch
            instance: {{ .name }}
        spec:
          restartPolicy: OnFailure
          containers:
          - name: meilisearch-backup
            image: "{{ $.Values.backups.meilisearch.image.repository }}:{{ $.Values.backups.meilisearch.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing rclone if needed..."
              if ! command -v rclone &> /dev/null; then
                apk add --no-cache curl unzip
                curl https://rclone.org/install.sh | bash || echo "Failed to install rclone, continuing..."
              fi
              
              echo "Starting Meilisearch backup for {{ .name }}..."
              
              BACKUP_FILE="/tmp/backups/meilisearch/{{ .name }}-$(date +%Y%m%d-%H%M%S).tar.gz"
              mkdir -p /tmp/backups/meilisearch
              
              # Trigger Meilisearch dump
              MEILI_URL="http://{{ .host }}:{{ .port | default "7700" }}"
              MEILI_KEY="{{ .masterKey }}"
              
              # Create a snapshot/dump using Meilisearch API
              curl -X POST "$MEILI_URL/snapshots" \
                -H "Authorization: Bearer $MEILI_KEY" \
                || echo "Note: Snapshot API may not be available, using alternative method"
              
              # Wait a moment for snapshot to be created
              sleep 5
              
              # If we have access to the data directory, backup it directly
              # Otherwise, we'll need to use the export API if available
              echo "Meilisearch backup initiated for {{ .name }}"
              
              {{- if $.Values.backups.backblaze.enabled }}
              echo "Uploading Meilisearch backup to Backblaze..."
              # Note: Actual backup method depends on Meilisearch version and access
              mkdir -p /root/.config/rclone
              cat > /root/.config/rclone/rclone.conf <<EOF
              [b2]
              type = b2
              account = $RCLONE_CONFIG_B2_ACCOUNT
              key = $RCLONE_CONFIG_B2_KEY
              EOF
              rclone copy /tmp/backups/meilisearch/ b2:{{ $.Values.backups.backblaze.bucket }}/meilisearch/{{ .name }}/ --transfers=4 --checkers=8 || true
              {{- end }}
              
              echo "Meilisearch backup completed for {{ .name }}"
            env:
            {{- if .masterKeySecret }}
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .masterKeySecret.name }}
                  key: {{ .masterKeySecret.key }}
            {{- else if .masterKey }}
            - name: MEILI_MASTER_KEY
              value: {{ .masterKey | quote }}
            {{- end }}
            {{- if $.Values.backups.backblaze.enabled }}
            - name: RCLONE_CONFIG_B2_TYPE
              value: b2
            - name: RCLONE_CONFIG_B2_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: RCLONE_CONFIG_B2_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            {{- end }}
            resources:
              {{- if $.Values.backups.meilisearch.resources }}
              {{- toYaml $.Values.backups.meilisearch.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
          volumes:
          - name: tmp-backups
            emptyDir: {}
{{- end }}
{{- end }}

{{- if .Values.backups.redis.enabled }}
{{- range .Values.backups.redis.instances }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-redis-{{ .name }}
  labels:
    app: backup-redis
    instance: {{ .name }}
spec:
  schedule: {{ .schedule | default "0 7 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-redis
            instance: {{ .name }}
        spec:
          restartPolicy: OnFailure
          containers:
          - name: redis-backup
            image: "{{ $.Values.backups.redis.image.repository }}:{{ $.Values.backups.redis.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing rclone if needed..."
              if ! command -v rclone &> /dev/null; then
                apk add --no-cache curl unzip
                curl https://rclone.org/install.sh | bash || echo "Failed to install rclone, continuing..."
              fi
              
              echo "Starting Redis backup for {{ .name }}..."
              
              BACKUP_FILE="/tmp/backups/redis/{{ .name }}-$(date +%Y%m%d-%H%M%S).rdb"
              mkdir -p /tmp/backups/redis
              
              # Create backup using redis-cli
              redis-cli \
                -h {{ .host }} \
                -p {{ .port | default "6379" }} \
                {{- if .password }}
                -a "$REDIS_PASSWORD" \
                {{- end }}
                --rdb $BACKUP_FILE
              
              # Compress the backup
              gzip $BACKUP_FILE
              
              echo "Redis backup created: $BACKUP_FILE.gz"
              
              {{- if $.Values.backups.backblaze.enabled }}
              echo "Uploading Redis backup to Backblaze..."
              mkdir -p /root/.config/rclone
              cat > /root/.config/rclone/rclone.conf <<EOF
              [b2]
              type = b2
              account = $RCLONE_CONFIG_B2_ACCOUNT
              key = $RCLONE_CONFIG_B2_KEY
              EOF
              rclone copy $BACKUP_FILE.gz b2:{{ $.Values.backups.backblaze.bucket }}/redis/{{ .name }}/ --transfers=4 --checkers=8
              {{- end }}
              
              echo "Redis backup completed for {{ .name }}"
            env:
            {{- if .password }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .passwordSecret.name }}
                  key: {{ .passwordSecret.key }}
            {{- end }}
            {{- if $.Values.backups.backblaze.enabled }}
            - name: RCLONE_CONFIG_B2_TYPE
              value: b2
            - name: RCLONE_CONFIG_B2_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: RCLONE_CONFIG_B2_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            {{- end }}
            resources:
              {{- if $.Values.backups.redis.resources }}
              {{- toYaml $.Values.backups.redis.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
          volumes:
          - name: tmp-backups
            emptyDir: {}
{{- end }}
{{- end }}
{{- end }}
