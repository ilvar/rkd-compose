{{- if .Values.backups.enabled }}
{{- if .Values.backups.velero.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-velero
  labels:
    app: backup-velero
spec:
  schedule: {{ .Values.backups.velero.schedule | default "0 2 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-velero
        spec:
          serviceAccountName: {{ .Values.backups.serviceAccountName | default "backup" }}
          restartPolicy: OnFailure
          containers:
          - name: velero-backup
            image: "{{ .Values.backups.velero.image.repository }}:{{ .Values.backups.velero.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing rclone if needed..."
              if ! command -v rclone &> /dev/null; then
                apk add --no-cache curl unzip || apt-get update && apt-get install -y curl unzip
                curl https://rclone.org/install.sh | bash || echo "Failed to install rclone, continuing..."
              fi
              
              echo "Starting Velero backup..."
              
              # Create backup
              BACKUP_NAME="velero-backup-$(date +%Y%m%d-%H%M%S)"
              velero backup create $BACKUP_NAME --wait
              
              # Upload to Backblaze if configured
              {{- if .Values.backups.backblaze.enabled }}
              echo "Uploading Velero backup to Backblaze..."
              mkdir -p /root/.config/rclone
              cat > /root/.config/rclone/rclone.conf <<EOF
              [b2]
              type = b2
              account = $RCLONE_CONFIG_B2_ACCOUNT
              key = $RCLONE_CONFIG_B2_KEY
              EOF
              rclone copy /tmp/backups/velero b2:{{ .Values.backups.backblaze.bucket }}/velero/ --transfers=4 --checkers=8
              {{- end }}
              
              echo "Velero backup completed: $BACKUP_NAME"
            env:
            {{- if .Values.backups.backblaze.enabled }}
            - name: RCLONE_CONFIG_B2_TYPE
              value: b2
            - name: RCLONE_CONFIG_B2_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: RCLONE_CONFIG_B2_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            {{- end }}
            resources:
              {{- if .Values.backups.velero.resources }}
              {{- toYaml .Values.backups.velero.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
{{- end }}

{{- if .Values.backups.etcd.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-etcd
  labels:
    app: backup-etcd
spec:
  schedule: {{ .Values.backups.etcd.schedule | default "0 3 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-etcd
        spec:
          hostNetwork: true
          hostPID: true
          restartPolicy: OnFailure
          containers:
          - name: etcd-backup
            image: "{{ .Values.backups.etcd.image.repository }}:{{ .Values.backups.etcd.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing etcdctl and rclone if needed..."
              
              # Install etcdctl if not available
              if ! command -v etcdctl &> /dev/null; then
                apk add --no-cache curl tar || true
                ARCH=$(uname -m)
                if [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
                  ETCD_ARCH="amd64"
                elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                  ETCD_ARCH="arm64"
                else
                  ETCD_ARCH="amd64"
                fi
                ETCD_VERSION="v3.5.9"
                curl -L https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/etcd-${ETCD_VERSION}-linux-${ETCD_ARCH}.tar.gz -o /tmp/etcd.tar.gz 2>/dev/null || echo "Failed to download etcd"
                tar -xz -C /tmp -f /tmp/etcd.tar.gz 2>/dev/null || echo "Failed to extract etcd"
                cp /tmp/etcd-${ETCD_VERSION}-linux-${ETCD_ARCH}/etcdctl /usr/local/bin/ 2>/dev/null || echo "Failed to copy etcdctl"
                chmod +x /usr/local/bin/etcdctl 2>/dev/null || true
                rm -rf /tmp/etcd* 2>/dev/null || true
              fi
              
              # Install rclone if not available
              if ! command -v rclone &> /dev/null; then
                apk add --no-cache curl unzip || true
                # Download and install rclone manually (works with sh, no bash needed)
                ARCH=$(uname -m)
                if [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
                  RCLONE_ARCH="amd64"
                elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                  RCLONE_ARCH="arm64"
                else
                  RCLONE_ARCH="amd64"
                fi
                curl -L https://downloads.rclone.org/rclone-current-linux-${RCLONE_ARCH}.zip -o /tmp/rclone.zip 2>/dev/null || echo "Failed to download rclone"
                unzip -q /tmp/rclone.zip -d /tmp 2>/dev/null || echo "Failed to unzip rclone"
                cp /tmp/rclone-*-linux-${RCLONE_ARCH}/rclone /usr/local/bin/ 2>/dev/null || echo "Failed to copy rclone"
                chmod +x /usr/local/bin/rclone 2>/dev/null || true
                # Cleanup
                rm -rf /tmp/rclone* 2>/dev/null || true
              fi
              
              echo "Starting etcd backup..."
              
              BACKUP_DIR="/tmp/backups/etcd"
              mkdir -p $BACKUP_DIR
              
              # Delete old backup files before creating new one
              echo "Cleaning up old etcd backup files..."
              rm -f $BACKUP_DIR/etcd-backup-*.db 2>/dev/null || true
              
              BACKUP_FILE="$BACKUP_DIR/etcd-backup-$(date +%Y%m%d-%H%M%S).db"
              
              # Backup etcd
              ETCD_ENDPOINTS="{{ .Values.backups.etcd.endpoints | default "https://127.0.0.1:2379" }}"
              ETCD_CA="{{ .Values.backups.etcd.ca | default "/var/lib/rancher/k3s/server/tls/etcd/server-ca.crt" }}"
              ETCD_CERT="{{ .Values.backups.etcd.cert | default "/var/lib/rancher/k3s/server/tls/etcd/server-client.crt" }}"
              ETCD_KEY="{{ .Values.backups.etcd.key | default "/var/lib/rancher/k3s/server/tls/etcd/server-client.key" }}"
              
              ETCDCTL_API=3 etcdctl \
                --endpoints=$ETCD_ENDPOINTS \
                --cacert=$ETCD_CA \
                --cert=$ETCD_CERT \
                --key=$ETCD_KEY \
                snapshot save $BACKUP_FILE
              
              echo "etcd backup created: $BACKUP_FILE"
              
              {{- if .Values.backups.backblaze.enabled }}
              echo "Uploading etcd backup to Backblaze..."
              mkdir -p /root/.config/rclone
              cat > /root/.config/rclone/rclone.conf <<EOF
              [b2]
              type = b2
              account = $RCLONE_CONFIG_B2_ACCOUNT
              key = $RCLONE_CONFIG_B2_KEY
              EOF
              rclone copy $BACKUP_FILE b2:{{ .Values.backups.backblaze.bucket }}/etcd/ --transfers=4 --checkers=8
              {{- end }}
              
              echo "etcd backup completed"
            securityContext:
              privileged: true
            volumeMounts:
            - name: etcd-data
              mountPath: /var/lib/rancher/k3s/server
              readOnly: true
            - name: tmp-backups
              mountPath: /tmp/backups
            env:
            {{- if .Values.backups.backblaze.enabled }}
            - name: RCLONE_CONFIG_B2_TYPE
              value: b2
            - name: RCLONE_CONFIG_B2_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: RCLONE_CONFIG_B2_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            {{- end }}
            resources:
              {{- if .Values.backups.etcd.resources }}
              {{- toYaml .Values.backups.etcd.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
          volumes:
          - name: etcd-data
            hostPath:
              path: /var/lib/rancher/k3s/server
              type: Directory
          - name: tmp-backups
            emptyDir: {}
{{- end }}

{{- if .Values.backups.postgres.enabled }}
{{- range .Values.backups.postgres.databases }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres-{{ .name }}
  labels:
    app: backup-postgres
    database: {{ .name }}
spec:
  schedule: {{ .schedule | default "0 4 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-postgres
            database: {{ .name }}
        spec:
          restartPolicy: OnFailure
          {{- if and $.Values.backups $.Values.backups.immichData $.Values.backups.immichData.affinity }}
          affinity:
            {{- toYaml $.Values.backups.immichData.affinity | nindent 12 }}
          {{- else }}
          {{- include "apps-chart.excludeNodeAffinity" . | nindent 10 }}
          {{- end }}
          containers:
          - name: postgres-backup
            image: "{{ $.Values.backups.postgres.image.repository }}:{{ $.Values.backups.postgres.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing rclone if needed..."
              if ! command -v rclone &> /dev/null; then
                apk add --no-cache curl unzip || true
                # Download and install rclone manually (works with sh, no bash needed)
                ARCH=$(uname -m)
                if [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
                  RCLONE_ARCH="amd64"
                elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                  RCLONE_ARCH="arm64"
                else
                  RCLONE_ARCH="amd64"
                fi
                curl -L https://downloads.rclone.org/rclone-current-linux-${RCLONE_ARCH}.zip -o /tmp/rclone.zip 2>/dev/null || echo "Failed to download rclone"
                unzip -q /tmp/rclone.zip -d /tmp 2>/dev/null || echo "Failed to unzip rclone"
                cp /tmp/rclone-*-linux-${RCLONE_ARCH}/rclone /usr/local/bin/ 2>/dev/null || echo "Failed to copy rclone"
                chmod +x /usr/local/bin/rclone 2>/dev/null || true
                # Cleanup
                rm -rf /tmp/rclone* 2>/dev/null || true
              fi
              
              echo "Starting PostgreSQL backup for {{ .name }}..."
              
              BACKUP_DIR="/tmp/backups/postgres"
              mkdir -p $BACKUP_DIR
              
              # Delete old backup files before creating new one
              echo "Cleaning up old PostgreSQL backup files..."
              rm -f $BACKUP_DIR/{{ .name }}-*.sql.gz 2>/dev/null || true
              
              BACKUP_FILE="$BACKUP_DIR/{{ .name }}-$(date +%Y%m%d-%H%M%S).sql.gz"
              
              # Create backup
              PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
                -h {{ .host }} \
                -p {{ .port | default "5432" }} \
                -U {{ .user }} \
                -d {{ .database }} \
                {{- if .options }}
                {{ .options }}
                {{- else }}
                --clean --if-exists
                {{- end }} | gzip > $BACKUP_FILE
              
              echo "PostgreSQL backup created: $BACKUP_FILE"
              
              {{- if $.Values.backups.backblaze.enabled }}
              echo "Uploading PostgreSQL backup to Backblaze..."
              mkdir -p /root/.config/rclone
              cat > /root/.config/rclone/rclone.conf <<EOF
              [b2]
              type = b2
              account = $RCLONE_CONFIG_B2_ACCOUNT
              key = $RCLONE_CONFIG_B2_KEY
              EOF
              rclone copy $BACKUP_FILE b2:{{ $.Values.backups.backblaze.bucket }}/postgres/{{ .name }}/ --transfers=4 --checkers=8
              {{- end }}
              
              echo "PostgreSQL backup completed for {{ .name }}"
            env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .passwordKey | default "postgres-password" }}
            {{- if $.Values.backups.backblaze.enabled }}
            - name: RCLONE_CONFIG_B2_TYPE
              value: b2
            - name: RCLONE_CONFIG_B2_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: RCLONE_CONFIG_B2_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            {{- end }}
            resources:
              {{- if $.Values.backups.postgres.resources }}
              {{- toYaml $.Values.backups.postgres.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
          volumes:
          - name: tmp-backups
            emptyDir: {}
{{- end }}
{{- end }}

{{- if .Values.backups.mysql.enabled }}
{{- range .Values.backups.mysql.databases }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-mysql-{{ .name }}
  labels:
    app: backup-mysql
    database: {{ .name }}
spec:
  schedule: {{ .schedule | default "0 5 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-mysql
            database: {{ .name }}
        spec:
          restartPolicy: OnFailure
          containers:
          - name: mysql-backup
            image: "{{ $.Values.backups.mysql.image.repository }}:{{ $.Values.backups.mysql.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing mysql-client and rclone if needed..."
              
              # Install mysql-client (contains mysqldump) and other tools
              if ! command -v mysqldump &> /dev/null; then
                apk add --no-cache mariadb-client curl unzip || echo "Failed to install mariadb-client"
              fi
              
              # Install rclone if needed
              if ! command -v rclone &> /dev/null; then
                apk add --no-cache curl unzip || true
                # Download and install rclone manually (works with sh, no bash needed)
                ARCH=$(uname -m)
                if [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
                  RCLONE_ARCH="amd64"
                elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                  RCLONE_ARCH="arm64"
                else
                  RCLONE_ARCH="amd64"
                fi
                curl -L https://downloads.rclone.org/rclone-current-linux-${RCLONE_ARCH}.zip -o /tmp/rclone.zip 2>/dev/null || echo "Failed to download rclone"
                unzip -q /tmp/rclone.zip -d /tmp 2>/dev/null || echo "Failed to unzip rclone"
                cp /tmp/rclone-*-linux-${RCLONE_ARCH}/rclone /usr/local/bin/ 2>/dev/null || echo "Failed to copy rclone"
                chmod +x /usr/local/bin/rclone 2>/dev/null || true
                # Cleanup
                rm -rf /tmp/rclone* 2>/dev/null || true
              fi
              
              echo "Starting MySQL backup for {{ .name }}..."
              
              BACKUP_DIR="/tmp/backups/mysql"
              mkdir -p $BACKUP_DIR
              
              # Delete old backup files before creating new one
              echo "Cleaning up old MySQL backup files..."
              rm -f $BACKUP_DIR/{{ .name }}-*.sql.gz 2>/dev/null || true
              
              BACKUP_FILE="$BACKUP_DIR/{{ .name }}-$(date +%Y%m%d-%H%M%S).sql.gz"
              
              # Create backup
              mysqldump \
                -h {{ .host }} \
                -P {{ .port | default "3306" }} \
                -u {{ .user }} \
                -p"$MYSQL_PASSWORD" \
                {{ .database }} \
                {{- if .options }}
                {{ .options }}
                {{- else }}
                --single-transaction --routines --triggers
                {{- end }} | gzip > $BACKUP_FILE
              
              echo "MySQL backup created: $BACKUP_FILE"
              
              {{- if $.Values.backups.backblaze.enabled }}
              echo "Uploading MySQL backup to Backblaze..."
              mkdir -p /root/.config/rclone
              cat > /root/.config/rclone/rclone.conf <<EOF
              [b2]
              type = b2
              account = $RCLONE_CONFIG_B2_ACCOUNT
              key = $RCLONE_CONFIG_B2_KEY
              EOF
              rclone copy $BACKUP_FILE b2:{{ $.Values.backups.backblaze.bucket }}/mysql/{{ .name }}/ --transfers=4 --checkers=8
              {{- end }}
              
              echo "MySQL backup completed for {{ .name }}"
            env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .passwordKey | default "mysql-password" }}
            {{- if $.Values.backups.backblaze.enabled }}
            - name: RCLONE_CONFIG_B2_TYPE
              value: b2
            - name: RCLONE_CONFIG_B2_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: RCLONE_CONFIG_B2_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            {{- end }}
            resources:
              {{- if $.Values.backups.mysql.resources }}
              {{- toYaml $.Values.backups.mysql.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
          volumes:
          - name: tmp-backups
            emptyDir: {}
{{- end }}
{{- end }}

{{- if .Values.backups.meilisearch.enabled }}
{{- range .Values.backups.meilisearch.instances }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-meilisearch-{{ .name }}
  labels:
    app: backup-meilisearch
    instance: {{ .name }}
spec:
  schedule: {{ .schedule | default "0 6 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-meilisearch
            instance: {{ .name }}
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          containers:
          - name: meilisearch-backup
            image: "{{ $.Values.backups.meilisearch.image.repository }}:{{ $.Values.backups.meilisearch.image.tag }}"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing rclone and curl if needed..."
              if ! command -v rclone &> /dev/null; then
                apk add --no-cache curl unzip || true
                # Download and install rclone manually (works with sh, no bash needed)
                ARCH=$(uname -m)
                if [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
                  RCLONE_ARCH="amd64"
                elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                  RCLONE_ARCH="arm64"
                else
                  RCLONE_ARCH="amd64"
                fi
                curl -L https://downloads.rclone.org/rclone-current-linux-${RCLONE_ARCH}.zip -o /tmp/rclone.zip 2>/dev/null || echo "Failed to download rclone"
                unzip -q /tmp/rclone.zip -d /tmp 2>/dev/null || echo "Failed to unzip rclone"
                cp /tmp/rclone-*-linux-${RCLONE_ARCH}/rclone /usr/local/bin/ 2>/dev/null || echo "Failed to copy rclone"
                chmod +x /usr/local/bin/rclone 2>/dev/null || true
                # Cleanup
                rm -rf /tmp/rclone* 2>/dev/null || true
              fi
              
              echo "Starting Meilisearch backup for {{ .name }}..."
              
              BACKUP_DIR="/tmp/backups/meilisearch"
              mkdir -p $BACKUP_DIR
              
              # Delete old backup files before creating new one
              echo "Cleaning up old Meilisearch backup files..."
              rm -f $BACKUP_DIR/{{ .name }}-*.tar.gz 2>/dev/null || true
              
              BACKUP_FILE="$BACKUP_DIR/{{ .name }}-$(date +%Y%m%d-%H%M%S).tar.gz"
              
              # Trigger Meilisearch dump
              MEILI_URL="http://{{ .host }}:{{ .port | default "7700" }}"
              MEILI_KEY="$MEILI_MASTER_KEY"
              
              # Create a snapshot/dump using Meilisearch API
              curl -X POST "$MEILI_URL/snapshots" \
                -H "Authorization: Bearer $MEILI_KEY" \
                || echo "Note: Snapshot API may not be available, using alternative method"
              
              # Wait a moment for snapshot to be created
              sleep 5
              
              # If we have access to the data directory, backup it directly
              # Otherwise, we'll need to use the export API if available
              echo "Meilisearch backup initiated for {{ .name }}"
              
              {{- if $.Values.backups.backblaze.enabled }}
              echo "Uploading Meilisearch backup to Backblaze..."
              # Note: Actual backup method depends on Meilisearch version and access
              mkdir -p /root/.config/rclone
              cat > /root/.config/rclone/rclone.conf <<EOF
              [b2]
              type = b2
              account = $RCLONE_CONFIG_B2_ACCOUNT
              key = $RCLONE_CONFIG_B2_KEY
              EOF
              rclone copy /tmp/backups/meilisearch/ b2:{{ $.Values.backups.backblaze.bucket }}/meilisearch/{{ .name }}/ --transfers=4 --checkers=8 || true
              {{- end }}
              
              echo "Meilisearch backup completed for {{ .name }}"
            env:
            {{- if .masterKeySecret }}
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .masterKeySecret.name }}
                  key: {{ .masterKeySecret.key }}
            {{- else if .masterKey }}
            - name: MEILI_MASTER_KEY
              value: {{ .masterKey | quote }}
            {{- end }}
            {{- if $.Values.backups.backblaze.enabled }}
            - name: RCLONE_CONFIG_B2_TYPE
              value: b2
            - name: RCLONE_CONFIG_B2_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: RCLONE_CONFIG_B2_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            {{- end }}
            resources:
              {{- if $.Values.backups.meilisearch.resources }}
              {{- toYaml $.Values.backups.meilisearch.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
          volumes:
          - name: tmp-backups
            emptyDir: {}
{{- end }}
{{- end }}

{{- if .Values.backups.redis.enabled }}
