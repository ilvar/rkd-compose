{{- if .Values.backups.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.backups.serviceAccountName | default "backup" }}
  labels:
    app: backup
{{- if .Values.backups.velero.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-velero
  labels:
    app: backup-velero
spec:
  schedule: {{ .Values.backups.velero.schedule | default "0 2 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-velero
        spec:
          serviceAccountName: {{ .Values.backups.serviceAccountName | default "backup" }}
          restartPolicy: OnFailure
          containers:
          - name: velero-backup
            image: "{{ .Values.backups.velero.image.repository }}:{{ .Values.backups.velero.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache restic 2>/dev/null || true

              echo "Starting Velero backup..."

              # Create backup
              BACKUP_NAME="velero-backup-$(date +%Y%m%d-%H%M%S)"
              velero backup create $BACKUP_NAME --wait

              {{- if .Values.backups.backblaze.enabled }}
              # Initialize restic repository if needed
              restic cat config > /dev/null 2>&1 || restic init

              echo "Uploading Velero backup to B2 via restic (encrypted)..."
              cd /tmp/backups/velero
              restic backup . --host backup-velero --compression auto
              {{- end }}

              echo "Velero backup completed: $BACKUP_NAME"
            env:
            {{- if .Values.backups.backblaze.enabled }}
            - name: B2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: B2_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.resticPasswordKey | default "restic-password" }}
            - name: RESTIC_REPOSITORY
              value: "b2:{{ .Values.backups.backblaze.bucket }}:velero"
            {{- end }}
            resources:
              {{- if .Values.backups.velero.resources }}
              {{- toYaml .Values.backups.velero.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
{{- end }}

{{- if .Values.backups.etcd.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-etcd
  labels:
    app: backup-etcd
spec:
  schedule: {{ .Values.backups.etcd.schedule | default "0 3 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-etcd
        spec:
          serviceAccountName: {{ .Values.backups.serviceAccountName | default "backup" }}
          hostNetwork: true
          hostPID: true
          restartPolicy: OnFailure
          containers:
          - name: etcd-backup
            image: "{{ .Values.backups.etcd.image.repository }}:{{ .Values.backups.etcd.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing etcdctl and restic..."

              # Install etcdctl if not available
              if ! command -v etcdctl > /dev/null 2>&1; then
                apk add --no-cache curl tar || true
                ARCH=$(uname -m)
                if [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
                  ETCD_ARCH="amd64"
                elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                  ETCD_ARCH="arm64"
                else
                  ETCD_ARCH="amd64"
                fi
                ETCD_VERSION="v3.5.9"
                curl -L https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}/etcd-${ETCD_VERSION}-linux-${ETCD_ARCH}.tar.gz -o /tmp/etcd.tar.gz 2>/dev/null || echo "Failed to download etcd"
                tar -xz -C /tmp -f /tmp/etcd.tar.gz 2>/dev/null || echo "Failed to extract etcd"
                cp /tmp/etcd-${ETCD_VERSION}-linux-${ETCD_ARCH}/etcdctl /usr/local/bin/ 2>/dev/null || echo "Failed to copy etcdctl"
                chmod +x /usr/local/bin/etcdctl 2>/dev/null || true
                rm -rf /tmp/etcd* 2>/dev/null || true
              fi

              # Install restic
              apk add --no-cache restic 2>/dev/null || true

              echo "Starting etcd backup..."

              BACKUP_DIR="/tmp/backup"
              mkdir -p $BACKUP_DIR

              BACKUP_FILE="$BACKUP_DIR/etcd-backup.db"

              # Backup etcd
              ETCD_ENDPOINTS="{{ .Values.backups.etcd.endpoints | default "https://127.0.0.1:2379" }}"
              ETCD_CA="{{ .Values.backups.etcd.ca | default "/var/lib/rancher/k3s/server/tls/etcd/server-ca.crt" }}"
              ETCD_CERT="{{ .Values.backups.etcd.cert | default "/var/lib/rancher/k3s/server/tls/etcd/server-client.crt" }}"
              ETCD_KEY="{{ .Values.backups.etcd.key | default "/var/lib/rancher/k3s/server/tls/etcd/server-client.key" }}"

              ETCDCTL_API=3 etcdctl \
                --endpoints=$ETCD_ENDPOINTS \
                --cacert=$ETCD_CA \
                --cert=$ETCD_CERT \
                --key=$ETCD_KEY \
                snapshot save $BACKUP_FILE

              echo "etcd backup created: $BACKUP_FILE"

              {{- if .Values.backups.backblaze.enabled }}
              # Initialize restic repository if needed
              restic cat config > /dev/null 2>&1 || restic init

              echo "Uploading etcd backup to B2 via restic (encrypted)..."
              cd $BACKUP_DIR
              restic backup . --host backup-etcd --compression auto
              {{- end }}

              echo "etcd backup completed"
            securityContext:
              privileged: true
            volumeMounts:
            - name: etcd-data
              mountPath: /var/lib/rancher/k3s/server
              readOnly: true
            env:
            {{- if .Values.backups.backblaze.enabled }}
            - name: B2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: B2_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.resticPasswordKey | default "restic-password" }}
            - name: RESTIC_REPOSITORY
              value: "b2:{{ .Values.backups.backblaze.bucket }}:etcd"
            {{- end }}
            resources:
              {{- if .Values.backups.etcd.resources }}
              {{- toYaml .Values.backups.etcd.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
          volumes:
          - name: etcd-data
            hostPath:
              path: /var/lib/rancher/k3s/server
              type: Directory
{{- end }}

{{- if .Values.backups.postgres.enabled }}
{{- range .Values.backups.postgres.databases }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres-{{ .name }}
  labels:
    app: backup-postgres
    database: {{ .name }}
spec:
  schedule: {{ .schedule | default "0 4 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-postgres
            database: {{ .name }}
        spec:
          serviceAccountName: {{ $.Values.backups.serviceAccountName | default "backup" }}
          restartPolicy: OnFailure
          {{- if and $.Values.backups $.Values.backups.immichData $.Values.backups.immichData.affinity }}
          affinity:
            {{- toYaml $.Values.backups.immichData.affinity | nindent 12 }}
          {{- else }}
          {{- include "apps-chart.excludeNodeAffinity" . | nindent 10 }}
          {{- end }}
          containers:
          - name: postgres-backup
            image: "{{ $.Values.backups.postgres.image.repository }}:{{ $.Values.backups.postgres.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache restic 2>/dev/null || true

              echo "Starting PostgreSQL backup for {{ .name }}..."

              BACKUP_DIR="/tmp/backup"
              mkdir -p $BACKUP_DIR
              rm -f $BACKUP_DIR/*.sql.gz 2>/dev/null || true

              BACKUP_FILE="$BACKUP_DIR/{{ .name }}.sql.gz"

              # Create backup
              PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
                -h {{ .host }} \
                -p {{ .port | default "5432" }} \
                -U {{ .user }} \
                -d {{ .database }} \
                {{- if .options }}
                {{ .options }}
                {{- else }}
                --clean --if-exists
                {{- end }} | gzip > $BACKUP_FILE

              echo "PostgreSQL backup created: $BACKUP_FILE"

              {{- if $.Values.backups.backblaze.enabled }}
              # Initialize restic repository if needed
              restic cat config > /dev/null 2>&1 || restic init

              echo "Uploading PostgreSQL backup to B2 via restic (encrypted)..."
              cd $BACKUP_DIR
              restic backup . --host backup-postgres-{{ .name }} --compression auto
              {{- end }}

              echo "PostgreSQL backup completed for {{ .name }}"
            env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .passwordKey | default "postgres-password" }}
            {{- if $.Values.backups.backblaze.enabled }}
            - name: B2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: B2_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.resticPasswordKey | default "restic-password" }}
            - name: RESTIC_REPOSITORY
              value: "b2:{{ $.Values.backups.backblaze.bucket }}:postgres/{{ .name }}"
            {{- end }}
            resources:
              {{- if $.Values.backups.postgres.resources }}
              {{- toYaml $.Values.backups.postgres.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
{{- end }}
{{- end }}

{{- if .Values.backups.mysql.enabled }}
{{- range .Values.backups.mysql.databases }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-mysql-{{ .name }}
  labels:
    app: backup-mysql
    database: {{ .name }}
spec:
  schedule: {{ .schedule | default "0 5 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-mysql
            database: {{ .name }}
        spec:
          serviceAccountName: {{ $.Values.backups.serviceAccountName | default "backup" }}
          restartPolicy: OnFailure
          containers:
          - name: mysql-backup
            image: "{{ $.Values.backups.mysql.image.repository }}:{{ $.Values.backups.mysql.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing mysql-client and restic..."

              # Install mysql-client (contains mysqldump)
              if ! command -v mysqldump > /dev/null 2>&1; then
                apk add --no-cache mariadb-client || echo "Failed to install mariadb-client"
              fi

              apk add --no-cache restic 2>/dev/null || true

              echo "Starting MySQL backup for {{ .name }}..."

              BACKUP_DIR="/tmp/backup"
              mkdir -p $BACKUP_DIR
              rm -f $BACKUP_DIR/*.sql.gz 2>/dev/null || true

              BACKUP_FILE="$BACKUP_DIR/{{ .name }}.sql.gz"

              # Create backup
              mysqldump \
                -h {{ .host }} \
                -P {{ .port | default "3306" }} \
                -u {{ .user }} \
                -p"$MYSQL_PASSWORD" \
                {{ .database }} \
                {{- if .options }}
                {{ .options }}
                {{- else }}
                --single-transaction --routines --triggers
                {{- end }} | gzip > $BACKUP_FILE

              echo "MySQL backup created: $BACKUP_FILE"

              {{- if $.Values.backups.backblaze.enabled }}
              # Initialize restic repository if needed
              restic cat config > /dev/null 2>&1 || restic init

              echo "Uploading MySQL backup to B2 via restic (encrypted)..."
              cd $BACKUP_DIR
              restic backup . --host backup-mysql-{{ .name }} --compression auto
              {{- end }}

              echo "MySQL backup completed for {{ .name }}"
            env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .passwordKey | default "mysql-password" }}
            {{- if $.Values.backups.backblaze.enabled }}
            - name: B2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: B2_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.resticPasswordKey | default "restic-password" }}
            - name: RESTIC_REPOSITORY
              value: "b2:{{ $.Values.backups.backblaze.bucket }}:mysql/{{ .name }}"
            {{- end }}
            resources:
              {{- if $.Values.backups.mysql.resources }}
              {{- toYaml $.Values.backups.mysql.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
{{- end }}
{{- end }}

{{- if .Values.backups.meilisearch.enabled }}
{{- range .Values.backups.meilisearch.instances }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-meilisearch-{{ .name }}
  labels:
    app: backup-meilisearch
    instance: {{ .name }}
spec:
  schedule: {{ .schedule | default "0 6 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-meilisearch
            instance: {{ .name }}
        spec:
          serviceAccountName: {{ $.Values.backups.serviceAccountName | default "backup" }}
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          containers:
          - name: meilisearch-backup
            image: "{{ $.Values.backups.meilisearch.image.repository }}:{{ $.Values.backups.meilisearch.image.tag }}"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache curl restic 2>/dev/null || true

              echo "Starting Meilisearch backup for {{ .name }}..."

              BACKUP_DIR="/tmp/backup"
              mkdir -p $BACKUP_DIR

              # Trigger Meilisearch snapshot
              MEILI_URL="http://{{ .host }}:{{ .port | default "7700" }}"
              MEILI_KEY="$MEILI_MASTER_KEY"

              curl -X POST "$MEILI_URL/snapshots" \
                -H "Authorization: Bearer $MEILI_KEY" \
                || echo "Note: Snapshot API may not be available, using alternative method"

              # Wait for snapshot to be created
              sleep 5

              echo "Meilisearch backup initiated for {{ .name }}"

              {{- if $.Values.backups.backblaze.enabled }}
              # Initialize restic repository if needed
              restic cat config > /dev/null 2>&1 || restic init

              echo "Uploading Meilisearch backup to B2 via restic (encrypted)..."
              cd /tmp/backup
              restic backup . --host backup-meilisearch-{{ .name }} --compression auto || true
              {{- end }}

              echo "Meilisearch backup completed for {{ .name }}"
            env:
            {{- if .masterKeySecret }}
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .masterKeySecret.name }}
                  key: {{ .masterKeySecret.key }}
            {{- else if .masterKey }}
            - name: MEILI_MASTER_KEY
              value: {{ .masterKey | quote }}
            {{- end }}
            {{- if $.Values.backups.backblaze.enabled }}
            - name: B2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: B2_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.backups.backblaze.secretName }}
                  key: {{ $.Values.backups.backblaze.resticPasswordKey | default "restic-password" }}
            - name: RESTIC_REPOSITORY
              value: "b2:{{ $.Values.backups.backblaze.bucket }}:meilisearch/{{ .name }}"
            {{- end }}
            resources:
              {{- if $.Values.backups.meilisearch.resources }}
              {{- toYaml $.Values.backups.meilisearch.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
{{- end }}
{{- end }}

{{- if .Values.backups.immichData.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-immich-data
  labels:
    app: backup-immich-data
spec:
  schedule: {{ .Values.backups.immichData.schedule | default "0 */6 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-immich-data
        spec:
          serviceAccountName: {{ .Values.backups.serviceAccountName | default "backup" }}
          restartPolicy: OnFailure
          {{- if .Values.backups.immichData.affinity }}
          affinity:
            {{- toYaml .Values.backups.immichData.affinity | nindent 12 }}
          {{- else }}
          {{- include "apps-chart.excludeNodeAffinity" . | nindent 10 }}
          {{- end }}
          containers:
          - name: immich-data-backup
            image: "{{ .Values.backups.immichData.image.repository }}:{{ .Values.backups.immichData.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache restic

              echo "Starting Immich data directory backup (encrypted)..."

              {{- if .Values.backups.backblaze.enabled }}
              # Initialize restic repository if needed
              restic cat config > /dev/null 2>&1 || restic init

              # Backup Immich data directory to B2 via restic
              # Restic handles incremental/deduplicated backups automatically
              cd /immich-data
              restic backup . --host backup-immich-data --compression auto \
                --verbose \
                --exclude-caches
              {{- end }}

              echo "Immich data backup completed"
            env:
            {{- if .Values.backups.backblaze.enabled }}
            - name: B2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: B2_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.resticPasswordKey | default "restic-password" }}
            - name: RESTIC_REPOSITORY
              value: "b2:{{ .Values.backups.backblaze.bucket }}:immich-data"
            {{- end }}
            resources:
              {{- if .Values.backups.immichData.resources }}
              {{- toYaml .Values.backups.immichData.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 2Gi
                cpu: 1000m
              requests:
                memory: 512Mi
                cpu: 500m
              {{- end }}
            volumeMounts:
            - name: immich-data
              mountPath: /immich-data
              readOnly: true
          volumes:
          - name: immich-data
            {{- if and .Values.backups .Values.backups.immichData .Values.backups.immichData.pvcName }}
            persistentVolumeClaim:
              claimName: {{ .Values.backups.immichData.pvcName }}
            {{- else }}
            hostPath:
              path: {{ .Values.backups.immichData.sourcePath }}
              type: Directory
            {{- end }}
{{- end }}

{{- if .Values.backups.cleanup.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-cleanup
  labels:
    app: backup-cleanup
spec:
  schedule: {{ .Values.backups.cleanup.schedule | default "0 8 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-cleanup
        spec:
          serviceAccountName: {{ .Values.backups.serviceAccountName | default "backup" }}
          restartPolicy: OnFailure
          containers:
          - name: cleanup
            image: "{{ .Values.backups.cleanup.image.repository }}:{{ .Values.backups.cleanup.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache restic

              BUCKET="{{ .Values.backups.backblaze.bucket }}"

              echo "Starting restic backup cleanup..."
              echo "Retention policy: 7 days daily, 12 months monthly"

              prune_repo() {
                REPO_PATH="$1"
                echo ""
                echo "========================================"
                echo "Pruning repository: $REPO_PATH"
                echo "========================================"
                export RESTIC_REPOSITORY="b2:$BUCKET:$REPO_PATH"
                # Only prune if the repo exists
                if restic cat config > /dev/null 2>&1; then
                  restic forget --keep-daily 7 --keep-monthly 12 --prune || echo "Warning: failed to prune $REPO_PATH"
                else
                  echo "Repository $REPO_PATH does not exist, skipping"
                fi
              }

              {{- if .Values.backups.velero.enabled }}
              prune_repo "velero"
              {{- end }}

              {{- if .Values.backups.etcd.enabled }}
              prune_repo "etcd"
              {{- end }}

              {{- if .Values.backups.postgres.enabled }}
              {{- range .Values.backups.postgres.databases }}
              prune_repo "postgres/{{ .name }}"
              {{- end }}
              {{- end }}

              {{- if .Values.backups.mysql.enabled }}
              {{- range .Values.backups.mysql.databases }}
              prune_repo "mysql/{{ .name }}"
              {{- end }}
              {{- end }}

              {{- if .Values.backups.meilisearch.enabled }}
              {{- range .Values.backups.meilisearch.instances }}
              prune_repo "meilisearch/{{ .name }}"
              {{- end }}
              {{- end }}

              {{- if .Values.backups.redis.enabled }}
              {{- range .Values.backups.redis.instances }}
              prune_repo "redis/{{ .name }}"
              {{- end }}
              {{- end }}

              {{- if .Values.backups.immichData.enabled }}
              prune_repo "immich-data"
              {{- end }}

              {{- if .Values.backups.beszel.enabled }}
              prune_repo "beszel"
              {{- end }}

              {{- if .Values.backups.zigbee2mqtt.enabled }}
              prune_repo "zigbee2mqtt"
              {{- end }}

              {{- if .Values.backups.hoarder.enabled }}
              prune_repo "hoarder"
              {{- end }}

              {{- if .Values.backups.bugsink.enabled }}
              prune_repo "bugsink"
              {{- end }}

              echo ""
              echo "========================================"
              echo "Backup cleanup completed"
              echo "========================================"
            env:
            {{- if .Values.backups.backblaze.enabled }}
            - name: B2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.accountIdKey | default "account-id" }}
            - name: B2_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.applicationKeyKey | default "application-key" }}
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backups.backblaze.secretName }}
                  key: {{ .Values.backups.backblaze.resticPasswordKey | default "restic-password" }}
            {{- end }}
            resources:
              {{- if .Values.backups.cleanup.resources }}
              {{- toYaml .Values.backups.cleanup.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 512Mi
                cpu: 500m
              requests:
                memory: 256Mi
                cpu: 200m
              {{- end }}
{{- end }}

