{{- if .Values.flaresolverr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  labels:
    app: flaresolverr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - hm60
{{- include "apps-chart.excludeNodeMatchExpressions" . | nindent 14 }}
      containers:
      - name: flaresolverr
        image: "{{ .Values.flaresolverr.image.repository }}:{{ .Values.flaresolverr.image.tag }}"
        ports:
        - name: http
          containerPort: 8191
          protocol: TCP
        env:
        - name: LOG_LEVEL
          value: {{ .Values.flaresolverr.environment.LOG_LEVEL | quote }}
        - name: LOG_HTML
          value: {{ .Values.flaresolverr.environment.LOG_HTML | quote }}
        - name: CAPTCHA_SOLVER
          value: {{ .Values.flaresolverr.environment.CAPTCHA_SOLVER | quote }}
        - name: TZ
          value: {{ .Values.flaresolverr.environment.TZ | quote }}
        resources:
          limits:
            memory: {{ .Values.flaresolverr.resources.limits.memory }}
          requests:
            memory: {{ .Values.flaresolverr.resources.requests.memory }}
            cpu: {{ .Values.flaresolverr.resources.requests.cpu }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  labels:
    app: flaresolverr
spec:
  ports:
  - port: 8191
    targetPort: http
    protocol: TCP
  selector:
    app: flaresolverr
{{- if and .Values.flaresolverr.enabled .Values.flaresolverr.ingress.enabled (gt (len .Values.flaresolverr.ingress.hosts) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flaresolverr
  labels:
    app: flaresolverr
spec:
{{- if gt (len .Values.flaresolverr.ingress.hosts) 0 }}
  tls:
  - hosts:
{{- range .Values.flaresolverr.ingress.hosts }}
    - {{ . | quote }}
{{- end }}
    secretName: homelab-wildcard-h-tls
{{- end }}
  rules:
  {{- range .Values.flaresolverr.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flaresolverr
            port:
              number: {{ $.Values.flaresolverr.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}
