{{- if .Values.compote.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: compote-secrets
  labels:
    app: compote
type: Opaque
stringData:
  caprover-password: {{ .Values.compote.secrets.caproverPassword | default "" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compote
  labels:
    app: compote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compote
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: compote
    spec:
      containers:
      - name: compote
        image: "{{ .Values.compote.image.repository }}:{{ .Values.compote.image.tag }}"
        env:
        - name: CAPROVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: compote-secrets
              key: caprover-password
        - name: CAPROVER_URL
          value: {{ .Values.compote.environment.CAPROVER_URL | quote }}
        resources:
          limits:
            memory: {{ .Values.compote.resources.limits.memory }}
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: data
          mountPath: /app/data
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.compote.storage.data }}
---
apiVersion: v1
kind: Service
metadata:
  name: compote
  labels:
    app: compote
spec:
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: compote
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.compote.storage.data }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
{{- if and .Values.compote.enabled .Values.compote.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compote
  labels:
    app: compote
spec:
  rules:
  {{- range .Values.compote.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: compote
            port:
              number: {{ $.Values.compote.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}

