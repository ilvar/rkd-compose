{{- if .Values.portainer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  labels:
    app: portainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      containers:
      - name: portainer
        image: "{{ .Values.portainer.image.repository }}:{{ .Values.portainer.image.tag }}"
        resources:
          limits:
            memory: {{ .Values.portainer.resources.limits.memory }}
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: data
          mountPath: /data
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.portainer.storage.data }}
---
apiVersion: v1
kind: Service
metadata:
  name: portainer
  labels:
    app: portainer
spec:
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
  selector:
    app: portainer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.portainer.storage.data }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
{{- if and .Values.portainer.enabled .Values.portainer.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portainer
  labels:
    app: portainer
spec:
  rules:
  {{- range .Values.portainer.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portainer
            port:
              number: {{ $.Values.portainer.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}

