{{- if .Values.kuma.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuma
  labels:
    app: kuma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuma
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: kuma
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      containers:
      - name: kuma
        image: "{{ .Values.kuma.image.repository }}:{{ .Values.kuma.image.tag }}"
        resources:
          limits:
            memory: {{ .Values.kuma.resources.limits.memory }}
        ports:
        - containerPort: 3001
          protocol: TCP
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: data
          mountPath: /app/data
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
      - name: data
        hostPath:
          path: /home/rkd/.docker/kuma/data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: kuma
  labels:
    app: kuma
spec:
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
  selector:
    app: kuma
{{- if and .Values.kuma.enabled .Values.kuma.ingress.enabled (gt (len .Values.kuma.ingress.hosts) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kuma
  labels:
    app: kuma
spec:
{{- $rkdHosts := fromJson (include "apps-chart.getRkdPwHosts" .Values.kuma.ingress.hosts) }}
{{- if gt (len $rkdHosts) 0 }}
  tls:
  - hosts:
{{- range $rkdHosts }}
    - {{ . | quote }}
{{- end }}
    secretName: homelab-wildcard-h-tls
{{- end }}
  rules:
  {{- range .Values.kuma.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kuma
            port:
              number: {{ $.Values.kuma.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}

