{{- if .Values.hoarder.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: hoarder-secrets
  labels:
    app: hoarder
type: Opaque
stringData:
  nextauth-secret: {{ .Values.hoarder.secrets.nextauthSecret | default "jedijedi" | quote }}
  meili-master-key: {{ .Values.hoarder.secrets.meiliMasterKey | default "jedijedi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoarder-web
  labels:
    app: hoarder-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hoarder-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: hoarder-web
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - hm60
{{- include "apps-chart.excludeNodeMatchExpressions" . | nindent 14 }}
      containers:
      - name: hoarder-web
        image: "{{ .Values.hoarder.web.image.repository }}:{{ .Values.hoarder.web.image.tag }}"
        env:
        - name: MEILI_ADDR
          value: {{ .Values.hoarder.web.environment.MEILI_ADDR | quote }}
        - name: BROWSER_WEB_URL
          value: {{ .Values.hoarder.web.environment.BROWSER_WEB_URL | quote }}
        - name: DATA_DIR
          value: {{ .Values.hoarder.web.environment.DATA_DIR | quote }}
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: hoarder-secrets
              key: nextauth-secret
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: hoarder-secrets
              key: meili-master-key
        - name: NEXTAUTH_URL
          value: {{ .Values.hoarder.web.environment.NEXTAUTH_URL | quote }}
        resources:
          limits:
            memory: {{ .Values.hoarder.web.resources.limits.memory }}
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        hostPath:
          path: /home/rkd/.nas/homelab/hoarder/data
          type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoarder-chrome
  labels:
    app: hoarder-chrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hoarder-chrome
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: hoarder-chrome
    spec:
      {{- include "apps-chart.excludeNodeAffinity" . | nindent 6 }}
      containers:
      - name: hoarder-chrome
        image: "{{ .Values.hoarder.chrome.image.repository }}:{{ .Values.hoarder.chrome.image.tag }}"
        args:
        - --no-sandbox
        - --disable-gpu
        - --disable-dev-shm-usage
        - --remote-debugging-address=0.0.0.0
        - --remote-debugging-port=9222
        - --hide-scrollbars
        ports:
        - containerPort: 9222
          protocol: TCP
        resources:
          limits:
            memory: {{ .Values.hoarder.chrome.resources.limits.memory }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoarder-meilisearch
  labels:
    app: hoarder-meilisearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hoarder-meilisearch
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: hoarder-meilisearch
    spec:
      {{- include "apps-chart.excludeNodeAffinity" . | nindent 6 }}
      containers:
      - name: hoarder-meilisearch
        image: "{{ .Values.hoarder.meilisearch.image.repository }}:{{ .Values.hoarder.meilisearch.image.tag }}"
        env:
        - name: MEILI_NO_ANALYTICS
          value: {{ .Values.hoarder.meilisearch.environment.MEILI_NO_ANALYTICS | quote }}
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: hoarder-secrets
              key: meili-master-key
        ports:
        - containerPort: 7700
          protocol: TCP
        resources:
          limits:
            memory: {{ .Values.hoarder.meilisearch.resources.limits.memory }}
          requests:
            memory: {{ .Values.hoarder.meilisearch.resources.requests.memory }}
            cpu: {{ .Values.hoarder.meilisearch.resources.requests.cpu }}
        volumeMounts:
        - name: data
          mountPath: /meili_data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.hoarder.meilisearch.storage.data }}
---
apiVersion: v1
kind: Service
metadata:
  name: hoarder-web
  labels:
    app: hoarder-web
spec:
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: hoarder-web
---
apiVersion: v1
kind: Service
metadata:
  name: hoarder-chrome
  labels:
    app: hoarder-chrome
spec:
  ports:
  - port: 9222
    targetPort: 9222
    protocol: TCP
  selector:
    app: hoarder-chrome
---
apiVersion: v1
kind: Service
metadata:
  name: hoarder-meilisearch
  labels:
    app: hoarder-meilisearch
spec:
  ports:
  - port: 7700
    targetPort: 7700
    protocol: TCP
  selector:
    app: hoarder-meilisearch
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.hoarder.web.storage.data }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.hoarder.meilisearch.storage.data }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 5Gi
{{- if and .Values.hoarder.enabled .Values.hoarder.ingress.enabled (gt (len .Values.hoarder.ingress.hosts) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hoarder
  labels:
    app: hoarder-web
spec:
{{- if gt (len .Values.hoarder.ingress.hosts) 0 }}
  tls:
  - hosts:
{{- range .Values.hoarder.ingress.hosts }}
    - {{ . | quote }}
{{- end }}
    secretName: homelab-wildcard-h-tls
{{- end }}
  rules:
  {{- range .Values.hoarder.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hoarder-web
            port:
              number: {{ $.Values.hoarder.ingress.servicePort }}
  {{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-hoarder-data
  labels:
    app: backup-hoarder
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: backup-hoarder
        spec:
          {{- include "apps-chart.excludeNodeAffinity" . | nindent 10 }}
          serviceAccountName: hoarder-backup
          containers:
          - name: hoarder-backup
            image: alpine:latest
            imagePullPolicy: Always
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing rclone and curl if needed..."
              if ! command -v rclone &> /dev/null; then
                apk add --no-cache curl unzip tar gzip || true
                # Download and install rclone
                ARCH=$(uname -m)
                if [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
                  RCLONE_ARCH="amd64"
                elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                  RCLONE_ARCH="arm64"
                else
                  RCLONE_ARCH="amd64"
                fi
                
                # Use redirect-based URL to avoid GitHub API rate limits
                curl -LsSf "https://downloads.rclone.org/rclone-current-linux-${RCLONE_ARCH}.zip" -o /tmp/rclone.zip
                cd /tmp && unzip -q rclone.zip && mv rclone-v*/rclone /usr/local/bin/ && chmod +x /usr/local/bin/rclone
              fi

              echo "Starting Hoarder backup..."
              BACKUP_DIR="/tmp/hoarder-backup-$(date +%Y%m%d-%H%M%S)"
              mkdir -p "$BACKUP_DIR/data"
              
              echo "Backing up database..."
              cp /hoarder-data/db.db "$BACKUP_DIR/data/" 2>/dev/null || echo "Database not found, skipping"
              
              echo "Backing up assets..."
              if [ -d "/hoarder-data/assets" ]; then
                tar -czf "$BACKUP_DIR/assets.tar.gz" -C /hoarder-data assets/ 2>/dev/null || echo "Assets directory not found"
              else
                echo "Assets directory not found, creating empty archive"
                mkdir -p /tmp/empty && tar -czf "$BACKUP_DIR/assets.tar.gz" -C /tmp empty/
              fi
              
              echo "Uploading to Backblaze B2..."
              REMOTE_PATH="homelab-rancher-backup/hoarder/$(date +%Y-%m-%d)"
              
              # Upload all files
              for file in "$BACKUP_DIR"/data/* "$BACKUP_DIR"/*.tar.gz; do
                if [ -f "$file" ]; then
                  echo "Uploading $(basename $file)..."
                  rclone copy "$file" "b2:${REMOTE_PATH}/" --b2-hard-delete --no-traverse
                fi
              done
              
              echo "✓ Backup complete"
              rm -rf "$BACKUP_DIR"
            env:
            - name: RCLONE_CONFIG_B2_TYPE
              value: b2
            - name: RCLONE_CONFIG_B2_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: backblaze-credentials
                  key: account-id
            - name: RCLONE_CONFIG_B2_KEY
              valueFrom:
                secretKeyRef:
                  name: backblaze-credentials
                  key: application-key
            volumeMounts:
            - name: hoarder-data
              mountPath: /hoarder-data
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 512Mi
                cpu: 500m
          volumes:
          - name: hoarder-data
            persistentVolumeClaim:
              claimName: hoarder-data
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hoarder-backup
{{- end }}
