{{- if .Values.homeassistant.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  labels:
    app: homeassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      containers:
      - name: homeassistant
        image: "{{ .Values.homeassistant.image.repository }}:{{ .Values.homeassistant.image.tag }}"
        resources:
          limits:
            memory: {{ .Values.homeassistant.resources.limits.memory }}
        ports:
        - containerPort: {{ .Values.homeassistant.ports.http }}
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
        securityContext:
          privileged: {{ .Values.homeassistant.privileged }}
      securityContext:
        runAsUser: {{ include "apps-chart.userID" .Values.homeassistant.user | int }}
        runAsGroup: {{ include "apps-chart.groupID" .Values.homeassistant.user | int }}
      volumes:
      - name: config
        hostPath:
          path: /home/rkd/.docker/hass-config
          type: DirectoryOrCreate
      - name: media
        hostPath:
          path: /home/rkd/.docker/hass_media
          type: DirectoryOrCreate
      - name: localtime
        hostPath:
          path: /etc/localtime
          type: File
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  labels:
    app: homeassistant
spec:
  ports:
  - port: {{ .Values.homeassistant.ports.http }}
    targetPort: {{ .Values.homeassistant.ports.http }}
    protocol: TCP
  selector:
    app: homeassistant
{{- if and .Values.homeassistant.enabled .Values.homeassistant.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeassistant
  labels:
    app: homeassistant
spec:
  rules:
  {{- range .Values.homeassistant.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homeassistant
            port:
              number: {{ $.Values.homeassistant.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}

