{{- if .Values.frigate.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  labels:
    app: frigate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frigate
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: frigate
      annotations:
        backup.velero.io/backup-volumes-excludes: cache
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
{{- include "apps-chart.excludeNodeMatchExpressions" . | nindent 14 }}
      containers:
      - name: frigate
        image: "{{ .Values.frigate.image.repository }}:{{ .Values.frigate.image.tag }}"
        env:
        {{- range $name, $value := .Values.frigate.environment }}
        - name: {{ $name }}
          value: {{ $value | quote }}
        {{- end }}
        resources:
          limits:
            memory: {{ .Values.frigate.resources.limits.memory }}
          requests:
            memory: {{ .Values.frigate.resources.requests.memory }}
            {{- if .Values.frigate.resources.requests.cpu }}
            cpu: {{ .Values.frigate.resources.requests.cpu }}
            {{- end }}
        ports:
        - containerPort: {{ .Values.frigate.ports.rtsp }}
          protocol: TCP
          hostPort: {{ .Values.frigate.ports.rtsp }}
        - containerPort: {{ .Values.frigate.ports.webrtc.tcp }}
          protocol: TCP
          hostPort: {{ .Values.frigate.ports.webrtc.tcp }}
        - containerPort: {{ .Values.frigate.ports.webrtc.udp }}
          protocol: UDP
          hostPort: {{ .Values.frigate.ports.webrtc.udp }}
        volumeMounts:
        - name: config
          mountPath: /config
        - name: storage
          mountPath: /media/frigate
        - name: cache
          mountPath: /tmp/cache
        - name: shm
          mountPath: /dev/shm
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
        {{- range .Values.frigate.deviceMounts }}
        - name: {{ .name }}
          mountPath: {{ .path }}
        {{- end }}
        securityContext:
          privileged: {{ .Values.frigate.privileged }}
      securityContext:
        seccompProfile:
          type: Unconfined
      volumes:
      - name: config
        hostPath:
          path: /home/rkd/.docker/frigate/config
          type: DirectoryOrCreate
      - name: storage
        hostPath:
          path: /home/rkd/.docker/frigate/storage
          type: DirectoryOrCreate
      - name: cache
        emptyDir:
          sizeLimit: {{ .Values.frigate.storage.cacheSize }}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: {{ .Values.frigate.storage.shmSize }}
      - name: localtime
        hostPath:
          path: /etc/localtime
          type: File
      {{- range .Values.frigate.deviceMounts }}
      - name: {{ .name }}
        hostPath:
          path: {{ .path }}
          {{- if .type }}
          type: {{ .type }}
          {{- end }}
      {{- end }}
      hostNetwork: false
      dnsPolicy: ClusterFirst
---
apiVersion: v1
kind: Service
metadata:
  name: frigate
  labels:
    app: frigate
spec:
  ports:
  - name: http
    port: {{ .Values.frigate.ingress.servicePort }}
    targetPort: {{ .Values.frigate.ingress.servicePort }}
    protocol: TCP
  - name: rtsp
    port: {{ .Values.frigate.ports.rtsp }}
    targetPort: {{ .Values.frigate.ports.rtsp }}
    protocol: TCP
  - name: webrtc-tcp
    port: {{ .Values.frigate.ports.webrtc.tcp }}
    targetPort: {{ .Values.frigate.ports.webrtc.tcp }}
    protocol: TCP
  - name: webrtc-udp
    port: {{ .Values.frigate.ports.webrtc.udp }}
    targetPort: {{ .Values.frigate.ports.webrtc.udp }}
    protocol: UDP
  selector:
    app: frigate
{{- if and .Values.frigate.enabled .Values.frigate.ingress.enabled (gt (len .Values.frigate.ingress.hosts) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frigate
  labels:
    app: frigate
spec:
{{- if gt (len .Values.frigate.ingress.hosts) 0 }}
  tls:
  - hosts:
{{- range .Values.frigate.ingress.hosts }}
    - {{ . | quote }}
{{- end }}
    secretName: homelab-wildcard-h-tls
{{- end }}
  rules:
  {{- range .Values.frigate.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frigate
            port:
              number: {{ $.Values.frigate.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}
