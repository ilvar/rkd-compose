{{- $veleroUi := index .Values "velero-ui" -}}
{{- if $veleroUi.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velero-ui
  labels:
    app: velero-ui
spec:
  tls:
  - hosts:
    - velero.h.rkd.pw
    secretName: homelab-wildcard-h-tls
  rules:
  - host: velero.h.rkd.pw
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ printf "%s-velero-ui" $.Release.Name }}
            port:
              number: 80
{{- end }}
