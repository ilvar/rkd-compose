{{- if .Values.zigbee2mqtt.enabled }}
{{- if .Values.zigbee2mqtt.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee2mqtt-config
  labels:
    app: zigbee2mqtt
data:
  configuration.yaml: |
{{ .Values.zigbee2mqtt.config | indent 4 }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-data
  labels:
    app: zigbee2mqtt
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  labels:
    app: zigbee2mqtt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zigbee2mqtt
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: zigbee2mqtt
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ .Values.zigbee2mqtt.nodeName | quote }}
{{- include "apps-chart.excludeNodeMatchExpressions" . | nindent 14 }}
      {{- if .Values.zigbee2mqtt.config }}
      initContainers:
      - name: init-config
        image: busybox:latest
        command: ['sh', '-c']
        args:
          - |
            if [ ! -f /app/data/configuration.yaml ]; then
              echo "Configuration file not found, creating from ConfigMap..."
              # Remove 8 spaces from the start of each line (4 from values.yaml + 4 from indent = 8 total)
              sed 's/^        //' /config/configuration.yaml > /app/data/configuration.yaml
              echo "Configuration file created successfully"
            else
              echo "Configuration file already exists, skipping initialization"
            fi
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config-template
          mountPath: /config
          readOnly: true
      {{- end }}
      containers:
      - name: zigbee2mqtt
        image: "{{ .Values.zigbee2mqtt.image.repository }}:{{ .Values.zigbee2mqtt.image.tag }}"
        env:
        - name: TZ
          value: {{ .Values.zigbee2mqtt.timezone | quote }}
        ports:
        - name: http
          containerPort: {{ .Values.zigbee2mqtt.ports.http }}
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: udev
          mountPath: /run/udev
          readOnly: true
        - name: device
          mountPath: {{ .Values.zigbee2mqtt.device }}
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
        securityContext:
          privileged: {{ .Values.zigbee2mqtt.privileged | default true }}
        resources:
          limits:
            memory: {{ .Values.zigbee2mqtt.resources.limits.memory }}
          requests:
            memory: {{ .Values.zigbee2mqtt.resources.requests.memory }}
            {{- if .Values.zigbee2mqtt.resources.requests.cpu }}
            cpu: {{ .Values.zigbee2mqtt.resources.requests.cpu }}
            {{- end }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: zigbee2mqtt-data
      {{- if .Values.zigbee2mqtt.config }}
      - name: config-template
        configMap:
          name: zigbee2mqtt-config
      {{- end }}
      - name: udev
        hostPath:
          path: /run/udev
          type: Directory
      - name: device
        hostPath:
          path: {{ .Values.zigbee2mqtt.device }}
          type: CharDevice
      - name: localtime
        hostPath:
          path: /etc/localtime
          type: File
---
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
  labels:
    app: zigbee2mqtt
spec:
  ports:
  - port: {{ .Values.zigbee2mqtt.ports.http }}
    targetPort: {{ .Values.zigbee2mqtt.ports.http }}
    protocol: TCP
  selector:
    app: zigbee2mqtt
{{- if and .Values.zigbee2mqtt.enabled .Values.zigbee2mqtt.ingress.enabled (gt (len .Values.zigbee2mqtt.ingress.hosts) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zigbee2mqtt
  labels:
    app: zigbee2mqtt
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
{{- if gt (len .Values.zigbee2mqtt.ingress.hosts) 0 }}
  tls:
  - hosts:
{{- range .Values.zigbee2mqtt.ingress.hosts }}
    - {{ . | quote }}
{{- end }}
    secretName: homelab-wildcard-h-tls
{{- end }}
  rules:
  {{- range .Values.zigbee2mqtt.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zigbee2mqtt
            port:
              number: {{ $.Values.zigbee2mqtt.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}
