{{- if .Values.bugsinkDb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bugsink-db
  labels:
    app: bugsink-db
spec:
  serviceName: bugsink-db
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: bugsink-db
  template:
    metadata:
      labels:
        app: bugsink-db
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      {{- include "apps-chart.excludeNodeAffinity" . | nindent 6 }}
      containers:
      - name: bugsink-db
        image: "{{ .Values.bugsinkDb.image.repository }}:{{ .Values.bugsinkDb.image.tag }}"
        env:
        - name: POSTGRES_USER
          value: {{ .Values.bugsinkDb.environment.POSTGRES_USER | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bugsink-db-secrets
              key: postgres-password
        - name: POSTGRES_DB
          value: {{ .Values.bugsinkDb.environment.POSTGRES_DB | quote }}
        resources:
          limits:
            memory: {{ .Values.bugsinkDb.resources.limits.memory }}
        ports:
        - containerPort: 5432
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.bugsinkDb.storage.size | default "2Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: bugsink-db
  labels:
    app: bugsink-db
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: bugsink-db
---
apiVersion: v1
kind: Secret
metadata:
  name: bugsink-db-secrets
  labels:
    app: bugsink-db
type: Opaque
stringData:
  postgres-password: {{ .Values.bugsinkDb.secrets.postgresPassword | quote }}
{{- end }}
---
{{- if .Values.bugsink.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugsink
  labels:
    app: bugsink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bugsink
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: bugsink
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      {{- include "apps-chart.excludeNodeAffinity" . | nindent 6 }}
      securityContext:
        runAsUser: {{ include "apps-chart.userID" .Values.bugsink.user | int }}
        runAsGroup: {{ include "apps-chart.groupID" .Values.bugsink.user | int }}
        fsGroup: {{ include "apps-chart.groupID" .Values.bugsink.user | int }}
      containers:
      - name: bugsink
        image: "{{ .Values.bugsink.image.repository }}:{{ .Values.bugsink.image.tag }}"
        env:
        - name: DATABASE_URL
          value: "postgres://{{ .Values.bugsinkDb.environment.POSTGRES_USER }}:{{ .Values.bugsinkDb.secrets.postgresPassword }}@bugsink-db:5432/{{ .Values.bugsinkDb.environment.POSTGRES_DB }}"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bugsink-secrets
              key: secret-key
        - name: CREATE_SUPERUSER
          value: {{ .Values.bugsink.environment.CREATE_SUPERUSER | quote }}
        - name: PORT
          value: {{ .Values.bugsink.environment.PORT | quote }}
        - name: BEHIND_HTTPS_PROXY
          value: {{ .Values.bugsink.environment.BEHIND_HTTPS_PROXY | quote }}
        - name: BASE_URL
          value: {{ .Values.bugsink.environment.BASE_URL | quote }}
        - name: EMAIL_HOST
          valueFrom:
            secretKeyRef:
              name: bugsink-email
              key: host
        - name: EMAIL_HOST_USER
          valueFrom:
            secretKeyRef:
              name: bugsink-email
              key: username
        - name: EMAIL_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bugsink-email
              key: password
        resources:
          limits:
            memory: {{ .Values.bugsink.resources.limits.memory }}
        ports:
        - containerPort: {{ .Values.bugsink.environment.PORT | int }}
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.bugsink.storage.data }}
---
apiVersion: v1
kind: Service
metadata:
  name: bugsink
  labels:
    app: bugsink
spec:
  ports:
  - port: {{ .Values.bugsink.ingress.servicePort }}
    targetPort: {{ .Values.bugsink.environment.PORT | int }}
    protocol: TCP
  selector:
    app: bugsink
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.bugsink.storage.data }}
spec:
  storageClassName: local-path-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
{{- if and .Values.bugsink.enabled .Values.bugsink.ingress.enabled (gt (len .Values.bugsink.ingress.hosts) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bugsink
  labels:
    app: bugsink
spec:
{{- if gt (len .Values.bugsink.ingress.hosts) 0 }}
  tls:
  - hosts:
{{- range .Values.bugsink.ingress.hosts }}
    - {{ . | quote }}
{{- end }}
    secretName: homelab-wildcard-h-tls
{{- end }}
  rules:
  {{- range .Values.bugsink.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bugsink
            port:
              number: {{ $.Values.bugsink.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}
