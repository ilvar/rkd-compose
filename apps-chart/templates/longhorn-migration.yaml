{{- if .Values.longhornMigration.enabled }}
---
# Longhorn PVC for Immich upload data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-upload-longhorn
  namespace: default
  labels:
    app: immich
    storage-type: longhorn
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.longhornMigration.storageClass | default "longhorn" }}
  resources:
    requests:
      storage: {{ .Values.longhornMigration.immich.size | default "500Gi" }}
---
# Longhorn PVC for Nextcloud data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data-longhorn
  namespace: default
  labels:
    app: nextcloud
    storage-type: longhorn
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.longhornMigration.storageClass | default "longhorn" }}
  resources:
    requests:
      storage: {{ .Values.longhornMigration.nextcloud.size | default "500Gi" }}
---
# CronJob to migrate Immich data from hostPath to Longhorn
apiVersion: batch/v1
kind: CronJob
metadata:
  name: migrate-immich-data-to-longhorn
  labels:
    app: longhorn-migration
    migration: immich
spec:
  schedule: {{ .Values.longhornMigration.immich.schedule | default "0 0 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400  # Keep job for 24 hours after completion
      template:
    metadata:
      labels:
        app: longhorn-migration
        migration: immich
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      containers:
      - name: rsync
        image: {{ .Values.longhornMigration.image.repository }}:{{ .Values.longhornMigration.image.tag }}
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Starting Immich data migration from hostPath to Longhorn..."
          echo "Source: {{ .Values.longhornMigration.immich.sourcePath }}"
          echo "Destination: /mnt/longhorn"
          
          # Install rsync if not available
          if ! command -v rsync &> /dev/null; then
            apk add --no-cache rsync || echo "rsync already available"
          fi
          
          # Check if source exists
          if [ ! -d "{{ .Values.longhornMigration.immich.sourcePath }}" ]; then
            echo "ERROR: Source directory does not exist: {{ .Values.longhornMigration.immich.sourcePath }}"
            exit 1
          fi
          
          # Create destination directory if it doesn't exist
          mkdir -p /mnt/longhorn
          
          # Perform rsync with progress
          echo "Starting rsync transfer..."
          rsync -avh --progress --stats \
            "{{ .Values.longhornMigration.immich.sourcePath }}/" \
            /mnt/longhorn/
          
          # Verify transfer
          echo "Verifying transfer..."
          SOURCE_SIZE=$(du -sb "{{ .Values.longhornMigration.immich.sourcePath }}" 2>/dev/null | cut -f1)
          DEST_SIZE=$(du -sb /mnt/longhorn 2>/dev/null | cut -f1)
          
          if [ "$SOURCE_SIZE" = "$DEST_SIZE" ]; then
            echo "✓ Migration completed successfully!"
            echo "Source size: $SOURCE_SIZE bytes"
            echo "Destination size: $DEST_SIZE bytes"
          else
            echo "⚠ WARNING: Size mismatch!"
            echo "Source size: $SOURCE_SIZE bytes"
            echo "Destination size: $DEST_SIZE bytes"
            echo "Please verify the migration manually."
          fi
          
          echo "Migration job completed."
        volumeMounts:
        - name: source-data
          mountPath: {{ .Values.longhornMigration.immich.sourcePath }}
          readOnly: true
        - name: longhorn-data
          mountPath: /mnt/longhorn
      volumes:
      - name: source-data
        hostPath:
          path: {{ .Values.longhornMigration.immich.sourcePath }}
          type: Directory
      - name: longhorn-data
        persistentVolumeClaim:
          claimName: immich-upload-longhorn
      resources:
        {{- if .Values.longhornMigration.resources }}
        {{- toYaml .Values.longhornMigration.resources | nindent 8 }}
        {{- else }}
        limits:
          memory: 2Gi
          cpu: 2000m
        requests:
          memory: 512Mi
          cpu: 500m
        {{- end }}
---
