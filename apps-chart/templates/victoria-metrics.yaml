{{- if .Values.victoriaMetrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  labels:
    app: victoria-metrics
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8428
      targetPort: 8428
      protocol: TCP
  selector:
    app: victoria-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics-http
  labels:
    app: victoria-metrics
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8428
      targetPort: 8428
      protocol: TCP
  selector:
    app: victoria-metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-metrics
  labels:
    app: victoria-metrics
spec:
  serviceName: victoria-metrics
  replicas: 1
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      containers:
      - name: victoria-metrics
        image: "{{ .Values.victoriaMetrics.image.repository }}:{{ .Values.victoriaMetrics.image.tag }}"
        args:
          - -storageDataPath=/storage
          - -retentionPeriod={{ .Values.victoriaMetrics.retentionPeriod }}
        ports:
          - name: http
            containerPort: 8428
            protocol: TCP
        volumeMounts:
          - name: storage
            mountPath: /storage
        resources:
          {{- toYaml .Values.victoriaMetrics.resources | nindent 10 }}
  volumeClaimTemplates:
    - metadata:
        name: storage
        labels:
          app: victoria-metrics
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.victoriaMetrics.storage.size }}
        {{- if .Values.victoriaMetrics.storage.storageClass }}
        storageClassName: {{ .Values.victoriaMetrics.storage.storageClass }}
        {{- end }}
{{- end }}
---
{{- if and .Values.victoriaMetrics.enabled .Values.victoriaMetrics.vmalert.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  labels:
    app: vmalert
data:
  rules.yml: |
{{- if .Values.victoriaMetrics.vmalert.rules }}
{{ .Values.victoriaMetrics.vmalert.rules | indent 4 }}
{{- else }}
    groups: []
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  labels:
    app: vmalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      {{- include "apps-chart.excludeNodeAffinity" . | nindent 6 }}
      containers:
      - name: vmalert
        image: "{{ .Values.victoriaMetrics.vmalert.image.repository }}:{{ .Values.victoriaMetrics.vmalert.image.tag }}"
        args:
          - -datasource.url=http://victoria-metrics-http:8428
          - -remoteRead.url=http://victoria-metrics-http:8428
          - -remoteWrite.url=http://victoria-metrics-http:8428
          - -notifier.url=http://vmalertmanager:9093
          - -rule=/etc/vmalert/rules.yml
          - -evaluationInterval={{ .Values.victoriaMetrics.vmalert.evaluationInterval }}
          - -httpListenAddr=:{{ .Values.victoriaMetrics.vmalert.port }}
        ports:
        - name: http
          containerPort: {{ .Values.victoriaMetrics.vmalert.port }}
          protocol: TCP
        volumeMounts:
        - name: rules
          mountPath: /etc/vmalert
          readOnly: true
        resources:
          {{- if .Values.victoriaMetrics.vmalert.resources }}
          {{- toYaml .Values.victoriaMetrics.vmalert.resources | nindent 10 }}
          {{- end }}
      volumes:
      - name: rules
        configMap:
          name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  labels:
    app: vmalert
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ .Values.victoriaMetrics.vmalert.port }}
    targetPort: {{ .Values.victoriaMetrics.vmalert.port }}
    protocol: TCP
  selector:
    app: vmalert
{{- end }}
---
{{- if and .Values.victoriaMetrics.enabled .Values.victoriaMetrics.vmalertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalertmanager-config
  labels:
    app: vmalertmanager
data:
  config.yml: |
{{ .Values.victoriaMetrics.vmalertmanager.config | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalertmanager
  labels:
    app: vmalertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalertmanager
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: vmalertmanager
    spec:
      {{- include "apps-chart.excludeNodeAffinity" . | nindent 6 }}
      containers:
      - name: vmalertmanager
        image: "{{ .Values.victoriaMetrics.vmalertmanager.image.repository }}:{{ .Values.victoriaMetrics.vmalertmanager.image.tag }}"
        args:
          - --config.file=/etc/alertmanager/config.yml
          - --storage.path=/var/lib/alertmanager
          - --web.listen-address=:{{ .Values.victoriaMetrics.vmalertmanager.port }}
        ports:
        - name: http
          containerPort: {{ .Values.victoriaMetrics.vmalertmanager.port }}
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
          readOnly: true
        - name: storage
          mountPath: /var/lib/alertmanager
        resources:
          {{- if .Values.victoriaMetrics.vmalertmanager.resources }}
          {{- toYaml .Values.victoriaMetrics.vmalertmanager.resources | nindent 10 }}
          {{- end }}
      volumes:
      - name: config
        configMap:
          name: vmalertmanager-config
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vmalertmanager
  labels:
    app: vmalertmanager
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ .Values.victoriaMetrics.vmalertmanager.port }}
    targetPort: {{ .Values.victoriaMetrics.vmalertmanager.port }}
    protocol: TCP
  selector:
    app: vmalertmanager
{{- end }}