{{- if .Values.tubearchivist.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: tubearchivist-secrets
  labels:
    app: tubearchivist
type: Opaque
stringData:
  ta-username: {{ .Values.tubearchivist.secrets.TA_USERNAME | default "tubearchivist" | quote }}
  ta-password: {{ .Values.tubearchivist.secrets.TA_PASSWORD | default "verysecret" | quote }}
  elastic-password: {{ .Values.tubearchivist.secrets.ELASTIC_PASSWORD | default "verysecret" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archivist-es
  labels:
    app: archivist-es
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archivist-es
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: archivist-es
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      containers:
      - name: archivist-es
        image: "{{ .Values.tubearchivist.es.image.repository }}:{{ .Values.tubearchivist.es.image.tag }}"
        env:
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tubearchivist-secrets
              key: elastic-password
        - name: ES_JAVA_OPTS
          value: {{ .Values.tubearchivist.es.environment.ES_JAVA_OPTS | quote }}
        resources:
          limits:
            memory: {{ .Values.tubearchivist.es.resources.limits.memory }}
        ports:
        - containerPort: 9200
          protocol: TCP
        volumeMounts:
        - name: es-data
          mountPath: /usr/share/elasticsearch/data
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
      - name: es-data
        hostPath:
          path: /home/rkd/.docker/tubearchivist/es
          type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archivist-redis
  labels:
    app: archivist-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archivist-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: archivist-redis
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      containers:
      - name: archivist-redis
        image: "{{ .Values.tubearchivist.redis.image.repository }}:{{ .Values.tubearchivist.redis.image.tag }}"
        ports:
        - containerPort: 6379
          protocol: TCP
        volumeMounts:
        - name: redis-data
          mountPath: /data
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: redis-data
        hostPath:
          path: /home/rkd/.docker/tubearchivist/redis
          type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tubearchivist
  labels:
    app: tubearchivist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tubearchivist
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tubearchivist
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      containers:
      - name: tubearchivist
        image: "{{ .Values.tubearchivist.image.repository }}:{{ .Values.tubearchivist.image.tag }}"
        env:
        - name: ES_URL
          value: {{ .Values.tubearchivist.environment.ES_URL | quote }}
        - name: REDIS_CON
          value: {{ .Values.tubearchivist.environment.REDIS_CON | quote }}
        - name: HOST_UID
          value: {{ .Values.tubearchivist.environment.HOST_UID | quote }}
        - name: HOST_GID
          value: {{ .Values.tubearchivist.environment.HOST_GID | quote }}
        - name: TA_HOST
          value: {{ .Values.tubearchivist.environment.TA_HOST | quote }}
        - name: TA_USERNAME
          valueFrom:
            secretKeyRef:
              name: tubearchivist-secrets
              key: ta-username
        - name: TA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tubearchivist-secrets
              key: ta-password
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tubearchivist-secrets
              key: elastic-password
        - name: TZ
          value: {{ .Values.tubearchivist.environment.TZ | quote }}
        resources:
          limits:
            memory: {{ .Values.tubearchivist.resources.limits.memory }}
        ports:
        - containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: media
          mountPath: /youtube
        - name: cache
          mountPath: /cache
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 120
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
      securityContext:
        runAsUser: {{ include "apps-chart.userID" .Values.tubearchivist.user | int }}
        runAsGroup: {{ include "apps-chart.groupID" .Values.tubearchivist.user | int }}
      volumes:
      - name: media
        hostPath:
          path: /home/rkd/.nas/YouTube
          type: DirectoryOrCreate
      - name: cache
        hostPath:
          path: /home/rkd/.docker/tubearchivist/cache
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: archivist-es
  labels:
    app: archivist-es
spec:
  ports:
  - port: 9200
    targetPort: 9200
    protocol: TCP
  selector:
    app: archivist-es
---
apiVersion: v1
kind: Service
metadata:
  name: archivist-redis
  labels:
    app: archivist-redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
  selector:
    app: archivist-redis
---
apiVersion: v1
kind: Service
metadata:
  name: tubearchivist
  labels:
    app: tubearchivist
spec:
  ports:
  - port: {{ .Values.tubearchivist.ports.http }}
    targetPort: {{ .Values.tubearchivist.ports.http }}
    protocol: TCP
  selector:
    app: tubearchivist
{{- if and .Values.tubearchivist.enabled .Values.tubearchivist.ingress.enabled (gt (len .Values.tubearchivist.ingress.hosts) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tubearchivist
  labels:
    app: tubearchivist
spec:
{{- if gt (len .Values.tubearchivist.ingress.hosts) 0 }}
  tls:
  - hosts:
{{- range .Values.tubearchivist.ingress.hosts }}
    - {{ . | quote }}
{{- end }}
    secretName: homelab-wildcard-h-tls
{{- end }}
  rules:
  {{- range .Values.tubearchivist.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tubearchivist
            port:
              number: {{ $.Values.tubearchivist.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}

