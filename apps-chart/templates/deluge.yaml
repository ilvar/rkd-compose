{{- if .Values.deluge.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge
  labels:
    app: deluge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deluge
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: deluge
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      containers:
      - name: deluge
        image: "{{ .Values.deluge.image.repository }}:{{ .Values.deluge.image.tag }}"
        env:
        - name: PUID
          value: {{ .Values.deluge.environment.PUID | quote }}
        - name: PGID
          value: {{ .Values.deluge.environment.PGID | quote }}
        - name: TZ
          value: {{ .Values.deluge.environment.TZ | quote }}
        - name: DELUGE_LOGLEVEL
          value: {{ .Values.deluge.environment.DELUGE_LOGLEVEL | quote }}
        resources:
          limits:
            memory: {{ .Values.deluge.resources.limits.memory }}
        ports:
        - containerPort: {{ .Values.deluge.ports.bittorrent.tcp }}
          protocol: TCP
          hostPort: {{ .Values.deluge.ports.bittorrent.tcp }}
        - containerPort: {{ .Values.deluge.ports.bittorrent.udp }}
          protocol: UDP
          hostPort: {{ .Values.deluge.ports.bittorrent.udp }}
        - containerPort: {{ .Values.deluge.ports.daemon }}
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: nas
          mountPath: /nas
        - name: downloads
          mountPath: /downloads
      volumes:
      - name: config
        hostPath:
          path: /home/rkd/.docker/deluge/config
          type: DirectoryOrCreate
      - name: nas
        hostPath:
          path: /home/rkd/.nas
          type: DirectoryOrCreate
      - name: downloads
        hostPath:
          path: /home/rkd/.nas/Downloads
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: deluge
  labels:
    app: deluge
spec:
  ports:
  - port: 8112
    targetPort: 8112
    protocol: TCP
  selector:
    app: deluge
{{- if and .Values.deluge.enabled .Values.deluge.ingress.enabled (gt (len .Values.deluge.ingress.hosts) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deluge
  labels:
    app: deluge
spec:
{{- if gt (len .Values.deluge.ingress.hosts) 0 }}
  tls:
  - hosts:
{{- range .Values.deluge.ingress.hosts }}
    - {{ . | quote }}
{{- end }}
    secretName: homelab-wildcard-h-tls
{{- end }}
  rules:
  {{- range .Values.deluge.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: deluge
            port:
              number: {{ $.Values.deluge.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}

