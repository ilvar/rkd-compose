{{- if .Values.videosCleanupReport.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: videos-cleanup-report
  labels:
    app: videos-cleanup-report
spec:
  schedule: {{ .Values.videosCleanupReport.schedule | default "0 2 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: videos-cleanup-report
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                    - rkd-um560
          restartPolicy: OnFailure
          containers:
          - name: videos-cleanup-report
            image: "{{ .Values.videosCleanupReport.image.repository }}:{{ .Values.videosCleanupReport.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              python3 << 'EOF'
              import os
              import re
              from pathlib import Path
              
              def get_size(path):
                  """Get total size of a file or directory in bytes."""
                  if os.path.isfile(path):
                      return os.path.getsize(path)
                  elif os.path.isdir(path):
                      total = 0
                      for dirpath, dirnames, filenames in os.walk(path):
                          for filename in filenames:
                              filepath = os.path.join(dirpath, filename)
                              try:
                                  total += os.path.getsize(filepath)
                              except (OSError, FileNotFoundError):
                                  pass
                      return total
                  return 0
              
              def format_size(size_bytes):
                  """Format size in human-readable format."""
                  for unit in ['B', 'KB', 'MB', 'GB', 'TB']:
                      if size_bytes < 1024.0:
                          return f"{size_bytes:.2f} {unit}"
                      size_bytes /= 1024.0
                  return f"{size_bytes:.2f} PB"
              
              # Pattern to match: anything ending with (number)
              pattern = re.compile(r'^.*\(\d+\)$')
              
              videos_path = Path('/videos')
              if not videos_path.exists():
                  print(f"ERROR: Path {videos_path} does not exist")
                  exit(1)
              
              print(f"Scanning top-level items in: {videos_path}")
              print("=" * 80)
              print("Files and directories that do NOT match pattern ^.*\\(\\d+\\)$:")
              print("=" * 80)
              
              non_matching_items = []
              total_size = 0
              
              # Only check top-level children
              try:
                  top_level_items = sorted(os.listdir(videos_path))
              except OSError as e:
                  print(f"ERROR: Cannot list directory {videos_path}: {e}")
                  exit(1)
              
              for item_name in top_level_items:
                  item_path = os.path.join(videos_path, item_name)
                  
                  # Check if this top-level item matches the pattern
                  if pattern.match(item_name):
                      # Matches pattern, skip it
                      continue
                  
                  # Doesn't match pattern - add it (including all contents if it's a directory)
                  if os.path.isdir(item_path):
                      size = get_size(item_path)
                      non_matching_items.append((item_name, size, 'DIR'))
                      total_size += size
                  elif os.path.isfile(item_path):
                      size = get_size(item_path)
                      non_matching_items.append((item_name, size, 'FILE'))
                      total_size += size
              
              # Sort by size (largest first)
              non_matching_items.sort(key=lambda x: x[1], reverse=True)
              
              # Print results
              if non_matching_items:
                  print(f"\nFound {len(non_matching_items)} items:")
                  print("-" * 80)
                  for rel_path, size, item_type in non_matching_items:
                      print(f"{item_type:4} | {format_size(size):>12} | {rel_path}")
                  print("-" * 80)
                  print(f"TOTAL SIZE: {format_size(total_size)}")
              else:
                  print("\nNo items found that don't match the pattern.")
              
              print("=" * 80)
              EOF
            resources:
              {{- if .Values.videosCleanupReport.resources }}
              {{- toYaml .Values.videosCleanupReport.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 256Mi
              requests:
                memory: 128Mi
              {{- end }}
            volumeMounts:
            - name: videos
              mountPath: /videos
              readOnly: true
          volumes:
          - name: videos
            hostPath:
              path: /home/rkd/.nas/Videos
              type: Directory
{{- end }}
