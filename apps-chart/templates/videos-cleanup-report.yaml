{{- if .Values.videosCleanupReport.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: videos-cleanup-report
  labels:
    app: videos-cleanup-report
spec:
  schedule: {{ .Values.videosCleanupReport.schedule | default "0 2 * * *" | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: videos-cleanup-report
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                    - rkd-um560
{{- include "apps-chart.excludeNodeMatchExpressions" . | nindent 18 }}
          restartPolicy: OnFailure
          containers:
          - name: videos-cleanup-report
            image: "{{ .Values.videosCleanupReport.image.repository }}:{{ .Values.videosCleanupReport.image.tag }}"
            command:
            - /bin/sh
            - -c
            - |
              python3 << 'EOF'
              import os
              import re
              import shutil
              import time
              from datetime import datetime, timedelta
              from pathlib import Path
              
              def get_size(path):
                  """Get total size of a file or directory in bytes."""
                  if os.path.isfile(path):
                      return os.path.getsize(path)
                  elif os.path.isdir(path):
                      total = 0
                      for dirpath, dirnames, filenames in os.walk(path):
                          for filename in filenames:
                              filepath = os.path.join(dirpath, filename)
                              try:
                                  total += os.path.getsize(filepath)
                              except (OSError, FileNotFoundError):
                                  pass
                      return total
                  return 0
              
              def format_size(size_bytes):
                  """Format size in human-readable format."""
                  for unit in ['B', 'KB', 'MB', 'GB', 'TB']:
                      if size_bytes < 1024.0:
                          return f"{size_bytes:.2f} {unit}"
                      size_bytes /= 1024.0
                  return f"{size_bytes:.2f} PB"
              
              # Pattern to match: anything ending with (number)
              pattern = re.compile(r'^.*\(\d+\)$')
              
              videos_path = Path('/videos')
              if not videos_path.exists():
                  print(f"ERROR: Path {videos_path} does not exist")
                  exit(1)
              
              print(f"Scanning top-level items in: {videos_path}")
              print("=" * 80)
              print("Files and directories that do NOT match pattern ^.*\\(\\d+\\)$:")
              print("=" * 80)
              
              non_matching_items = []
              total_size = 0
              
              # Only check top-level children
              try:
                  top_level_items = sorted(os.listdir(videos_path))
              except OSError as e:
                  print(f"ERROR: Cannot list directory {videos_path}: {e}")
                  exit(1)
              
              for item_name in top_level_items:
                  item_path = os.path.join(videos_path, item_name)
                  
                  # Check if this top-level item matches the pattern
                  if pattern.match(item_name):
                      # Matches pattern, skip it
                      continue
                  
                  # Doesn't match pattern - add it (including all contents if it's a directory)
                  if os.path.isdir(item_path):
                      size = get_size(item_path)
                      non_matching_items.append((item_name, size, 'DIR'))
                      total_size += size
                  elif os.path.isfile(item_path):
                      size = get_size(item_path)
                      non_matching_items.append((item_name, size, 'FILE'))
                      total_size += size
              
              # Sort by size (largest first)
              non_matching_items.sort(key=lambda x: x[1], reverse=True)
              
              # Print results
              if non_matching_items:
                  print(f"\nFound {len(non_matching_items)} items:")
                  print("-" * 80)
                  for rel_path, size, item_type in non_matching_items:
                      print(f"{item_type:4} | {format_size(size):>12} | {rel_path}")
                  print("-" * 80)
                  print(f"TOTAL SIZE: {format_size(total_size)}")
                  
                  # Delete non-matching items older than 14 days
                  print("\n" + "=" * 80)
                  print("Deleting non-matching items older than 14 days...")
                  print("=" * 80)
                  
                  deleted_count = 0
                  deleted_size = 0
                  skipped_count = 0
                  skipped_size = 0
                  errors = []
                  
                  # Calculate cutoff time (14 days ago)
                  cutoff_time = time.time() - (14 * 24 * 60 * 60)
                  
                  for item_name, size, item_type in non_matching_items:
                      item_path = os.path.join(videos_path, item_name)
                      
                      # Check if item is older than 14 days
                      try:
                          item_mtime = os.path.getmtime(item_path)
                          if item_mtime > cutoff_time:
                              # Item is newer than 14 days, skip deletion
                              age_days = (time.time() - item_mtime) / (24 * 60 * 60)
                              print(f"SKIPPED {item_type:4} | {format_size(size):>12} | {item_name} (age: {age_days:.1f} days)")
                              skipped_count += 1
                              skipped_size += size
                              continue
                      except OSError as e:
                          error_msg = f"ERROR checking age of {item_name}: {e}"
                          errors.append(error_msg)
                          print(error_msg)
                          continue
                      
                      # Item is old enough, proceed with deletion
                      try:
                          if item_type == 'DIR':
                              shutil.rmtree(item_path)
                              age_days = (time.time() - item_mtime) / (24 * 60 * 60)
                              print(f"DELETED DIR  | {format_size(size):>12} | {item_name} (age: {age_days:.1f} days)")
                          else:
                              os.remove(item_path)
                              age_days = (time.time() - item_mtime) / (24 * 60 * 60)
                              print(f"DELETED FILE | {format_size(size):>12} | {item_name} (age: {age_days:.1f} days)")
                          deleted_count += 1
                          deleted_size += size
                      except Exception as e:
                          error_msg = f"ERROR deleting {item_name}: {e}"
                          errors.append(error_msg)
                          print(error_msg)
                  
                  print("-" * 80)
                  print(f"Successfully deleted: {deleted_count}/{len(non_matching_items)} items")
                  print(f"Total size deleted: {format_size(deleted_size)}")
                  if skipped_count > 0:
                      print(f"\nSkipped (newer than 14 days): {skipped_count} items")
                      print(f"Total size skipped: {format_size(skipped_size)}")
                  if errors:
                      print(f"\nErrors encountered: {len(errors)}")
                      for error in errors:
                          print(f"  - {error}")
              else:
                  print("\nNo items found that don't match the pattern.")
              
              print("=" * 80)
              EOF
            resources:
              {{- if .Values.videosCleanupReport.resources }}
              {{- toYaml .Values.videosCleanupReport.resources | nindent 14 }}
              {{- else }}
              limits:
                memory: 256Mi
              requests:
                memory: 128Mi
              {{- end }}
            volumeMounts:
            - name: videos
              mountPath: /videos
              readOnly: false
          volumes:
          - name: videos
            hostPath:
              path: /home/rkd/.nas/Videos
              type: Directory
{{- end }}
