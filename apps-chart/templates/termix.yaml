{{- if .Values.termix.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
  labels:
    app: termix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: termix
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: termix
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      containers:
      - name: termix
        image: "{{ .Values.termix.image.repository }}:{{ .Values.termix.image.tag }}"
        env:
        - name: PORT
          value: {{ .Values.termix.environment.PORT | quote }}
        resources:
          limits:
            memory: {{ .Values.termix.resources.limits.memory }}
        ports:
        - containerPort: {{ .Values.termix.ports.http }}
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        hostPath:
          path: /home/rkd/.docker/termix/data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: termix
  labels:
    app: termix
spec:
  ports:
  - port: {{ .Values.termix.ports.http }}
    targetPort: {{ .Values.termix.ports.http }}
    protocol: TCP
  selector:
    app: termix
{{- if and .Values.termix.enabled .Values.termix.ingress.enabled (gt (len .Values.termix.ingress.hosts) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: termix
  labels:
    app: termix
spec:
{{- if gt (len .Values.termix.ingress.hosts) 0 }}
  tls:
  - hosts:
{{- range .Values.termix.ingress.hosts }}
    - {{ . | quote }}
{{- end }}
    secretName: homelab-wildcard-h-tls
{{- end }}
  rules:
  {{- range .Values.termix.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: termix
            port:
              number: {{ $.Values.termix.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}

