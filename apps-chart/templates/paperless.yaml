{{- if .Values.paperless.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: paperless-secrets
  labels:
    app: paperless
type: Opaque
stringData:
  secret-key: {{ .Values.paperless.secrets.secretKey | default "ilvar" | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-redis-data
  labels:
    app: paperless-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.paperless.redis.storage.size | default "1Gi" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paperless-redis
  labels:
    app: paperless-redis
spec:
  serviceName: paperless-redis
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: paperless-redis
  template:
    metadata:
      labels:
        app: paperless-redis
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      containers:
      - name: paperless-redis
        image: "{{ .Values.paperless.redis.image.repository }}:{{ .Values.paperless.redis.image.tag }}"
        ports:
        - containerPort: 6379
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: paperless-redis-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-webserver
  labels:
    app: paperless-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-webserver
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: paperless-webserver
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - rkd-um560
      containers:
      - name: paperless-webserver
        image: "{{ .Values.paperless.webserver.image.repository }}:{{ .Values.paperless.webserver.image.tag }}"
        env:
        - name: PAPERLESS_OCR_LANGUAGES
          value: {{ .Values.paperless.webserver.environment.PAPERLESS_OCR_LANGUAGES | quote }}
        - name: TZ
          value: {{ .Values.paperless.webserver.environment.TZ | quote }}
        - name: PAPERLESS_USE_SSL
          value: {{ .Values.paperless.webserver.environment.PAPERLESS_USE_SSL | quote }}
        - name: PAPERLESS_FORGIVING_OCR
          value: {{ .Values.paperless.webserver.environment.PAPERLESS_FORGIVING_OCR | quote }}
        - name: PAPERLESS_REDIS
          value: {{ .Values.paperless.webserver.environment.PAPERLESS_REDIS | quote }}
        - name: PAPERLESS_OCR_MODE
          value: {{ .Values.paperless.webserver.environment.PAPERLESS_OCR_MODE | quote }}
        - name: PAPERLESS_CONSUMER_DISABLE
          value: {{ .Values.paperless.webserver.environment.PAPERLESS_CONSUMER_DISABLE | quote }}
        - name: PAPERLESS_WEBSERVER_WORKERS
          value: {{ .Values.paperless.webserver.environment.PAPERLESS_WEBSERVER_WORKERS | quote }}
        - name: PAPERLESS_URL
          value: {{ .Values.paperless.webserver.environment.PAPERLESS_URL | quote }}
        - name: USE_X_FORWARD_HOST
          value: {{ .Values.paperless.webserver.environment.USE_X_FORWARD_HOST | quote }}
        - name: USE_X_FORWARD_PORT
          value: {{ .Values.paperless.webserver.environment.USE_X_FORWARD_PORT | quote }}
        - name: PAPERLESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: paperless-secrets
              key: secret-key
        ports:
        - containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /usr/src/paperless/data
        - name: media
          mountPath: /usr/src/paperless/media
        - name: export
          mountPath: /export
        - name: consume
          mountPath: /consume
      volumes:
      - name: data
        hostPath:
          path: /home/rkd/.docker/paperless/data
          type: DirectoryOrCreate
      - name: media
        hostPath:
          path: /home/rkd/.docker/paperless/media
          type: DirectoryOrCreate
      - name: export
        hostPath:
          path: /home/rkd/.docker/paperless/export
          type: DirectoryOrCreate
      - name: consume
        hostPath:
          path: /home/rkd/.docker/paperless/consume
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-redis
  labels:
    app: paperless-redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
  selector:
    app: paperless-redis
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-webserver
  labels:
    app: paperless-webserver
spec:
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: paperless-webserver
{{- if and .Values.paperless.enabled .Values.paperless.ingress.enabled (gt (len .Values.paperless.ingress.hosts) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
  labels:
    app: paperless-webserver
spec:
{{- if gt (len .Values.paperless.ingress.hosts) 0 }}
  tls:
  - hosts:
{{- range .Values.paperless.ingress.hosts }}
    - {{ . | quote }}
{{- end }}
    secretName: homelab-wildcard-h-tls
{{- end }}
  rules:
  {{- range .Values.paperless.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: paperless-webserver
            port:
              number: {{ $.Values.paperless.ingress.servicePort }}
  {{- end }}
{{- end }}
{{- end }}

