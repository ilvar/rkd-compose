[package]
name = "compote3"
version = "0.4.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "Dashboard for k3s ingresses, custom links and GitHub repositories"

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tiny_http = "0.12"
ureq = "3"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
rcgen = "0.14.9"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
as_conversions = "deny"
wildcard_imports = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
