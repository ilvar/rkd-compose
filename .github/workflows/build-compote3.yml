name: Build Compote3

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'compote3/**'
      - '.github/workflows/build-compote3.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0). If not provided, uses VERSION file or generates one.'
        required: false
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: ilvar/compote3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit VERSION file
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch full history for version calculation

      - name: Check if VERSION changed
        id: version_check
        if: github.event_name == 'push'
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep "^compote3/" || true)
          if echo "$CHANGED_FILES" | grep -q "compote3/VERSION"; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "VERSION file changed, will build"
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "VERSION file did not change, skipping build"
          fi
      
      - name: Skip workflow if VERSION didn't change
        if: github.event_name == 'push' && steps.version_check.outputs.version_changed != 'true'
        run: |
          echo "Skipping build because VERSION file did not change"
          exit 0

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.version_check.outputs.version_changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' || steps.version_check.outputs.version_changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        if: github.event_name == 'workflow_dispatch' || steps.version_check.outputs.version_changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Calculate version
        if: github.event_name == 'workflow_dispatch' || steps.version_check.outputs.version_changed == 'true'
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            # Manual version override
            VERSION="${{ github.event.inputs.version }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_manual=true" >> $GITHUB_OUTPUT
          elif [ -f compote3/VERSION ]; then
            # Use existing VERSION file
            VERSION=$(cat compote3/VERSION | tr -d '[:space:]')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_manual=false" >> $GITHUB_OUTPUT
          else
            # Generate date-based version
            VERSION="v$(date +%Y%m%d)-${GITHUB_SHA:0:7}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_manual=false" >> $GITHUB_OUTPUT
          fi
          echo "Version: $VERSION"

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || steps.version_check.outputs.version_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./compote3
          file: ./compote3/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

      - name: Update VERSION file (manual dispatch only)
        if: steps.version.outputs.is_manual == 'true'
        run: |
          echo "${{ steps.version.outputs.version }}" > compote3/VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compote3/VERSION
          git commit -m "chore: update compote3 version to ${{ steps.version.outputs.version }}"
          git push

      - name: Output current version
        if: github.event_name == 'workflow_dispatch' || steps.version_check.outputs.version_changed == 'true'
        run: |
          echo "::notice title=Compote3 Version::Built version: ${{ steps.version.outputs.version }}"
          echo "Current version: ${{ steps.version.outputs.version }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
      
      - name: Output image tags
        if: github.event_name == 'workflow_dispatch' || steps.version_check.outputs.version_changed == 'true'
        run: |
          echo "Built and pushed images:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"

      - name: Update values.yaml
        if: github.event_name == 'workflow_dispatch' || steps.version_check.outputs.version_changed == 'true'
        run: |
          # Update compote3 image tag in values.yaml using Python
          python3 << 'PYEOF'
          import re
          import sys
          import os
          
          version = os.environ['VERSION']
          values_file = 'apps-chart/values.yaml'
          
          try:
              with open(values_file, 'r') as f:
                  lines = f.readlines()
              
              updated = False
              in_compote3 = False
              in_image = False
              
              for i, line in enumerate(lines):
                  if line.strip().startswith('compote3:'):
                      in_compote3 = True
                  elif in_compote3 and line.strip().startswith('image:'):
                      in_image = True
                  elif in_image and line.strip().startswith('repository: ilvar/compote3'):
                      # Next line should be tag
                      if i + 1 < len(lines) and 'tag:' in lines[i + 1]:
                          lines[i + 1] = re.sub(r'tag:\s*[^\n]+', f'tag: {version}', lines[i + 1])
                          updated = True
                          break
                  elif in_compote3 and not line.startswith(' ') and not line.startswith('\t') and line.strip() != '':
                      # We've left the compote3 section
                      break
              
              if updated:
                  with open(values_file, 'w') as f:
                      f.writelines(lines)
                  print(f"✓ Updated compote3 tag to {version} in values.yaml")
                  sys.exit(0)
              else:
                  print(f"✗ Could not find compote3 tag to update")
                  sys.exit(1)
          except Exception as e:
              print(f"✗ Error updating values.yaml: {e}")
              sys.exit(1)
          PYEOF
          
          # Commit and push if changes were made
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps-chart/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update compote3 version to ${{ steps.version.outputs.version }} in values.yaml"
            git push
          else
            echo "No changes to values.yaml"
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}

