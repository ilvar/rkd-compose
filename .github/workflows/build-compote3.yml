name: Build Compote3

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'compote3/**'
      - '.github/workflows/build-compote3.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0). If not provided, uses VERSION file or generates one.'
        required: false
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: ilvar/compote3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit VERSION file
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for version calculation

      - name: Check if should skip (only VERSION changed)
        id: skip_check
        if: github.event_name == 'push'
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep "^compote3/" || true)
          if [ -z "$CHANGED_FILES" ] || [ "$CHANGED_FILES" == "compote3/VERSION" ]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Only VERSION file changed, skipping build"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Skip workflow if only VERSION changed
        if: steps.skip_check.outputs.should_skip == 'true'
        run: exit 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Calculate version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            # Manual version override
            VERSION="${{ github.event.inputs.version }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_manual=true" >> $GITHUB_OUTPUT
          elif [ -f compote3/VERSION ]; then
            # Use existing VERSION file
            VERSION=$(cat compote3/VERSION | tr -d '[:space:]')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_manual=false" >> $GITHUB_OUTPUT
          else
            # Generate date-based version
            VERSION="v$(date +%Y%m%d)-${GITHUB_SHA:0:7}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_manual=false" >> $GITHUB_OUTPUT
          fi
          echo "Version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./compote3
          file: ./compote3/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

      - name: Update VERSION file (manual dispatch only)
        if: steps.version.outputs.is_manual == 'true'
        run: |
          echo "${{ steps.version.outputs.version }}" > compote3/VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compote3/VERSION
          git commit -m "chore: update compote3 version to ${{ steps.version.outputs.version }}"
          git push

      - name: Output image tags
        run: |
          echo "Built and pushed images:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"

