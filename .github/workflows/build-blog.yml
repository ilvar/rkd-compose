name: Build Blog

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ilvar/blog

# Two pushes in quick succession would otherwise race to publish, and the
# loser could end up the newest tag in the registry.
concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The theme is a submodule; without it Hugo renders nothing.
          submodules: recursive

      # A blog is edited far more often than an application, so requiring a
      # hand-written VERSION bump per post would be friction that gets skipped
      # -- which is exactly how compote3 shipped a stale image. run_number is
      # monotonic, so every push publishes a higher semver patch that renovate
      # can compare against the tag in apps-chart/values.yaml and bump on its
      # own.
      - name: Calculate version
        id: version
        run: |
          version="1.0.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./blog
          file: ./blog/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published \`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Renovate raises the chart bump; nothing to edit by hand." >> "$GITHUB_STEP_SUMMARY"
