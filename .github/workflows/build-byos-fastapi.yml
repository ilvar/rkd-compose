name: Build BYOS FastAPI

on:
  push:
    branches:
      - main
    paths:
      - 'byos-fastapi/**'
      - '.github/workflows/build-byos-fastapi.yml'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ilvar/trmnl-server-waveshare
  IMAGE_TAG: main-10d16d7

concurrency:
  group: build-byos-fastapi
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./byos-fastapi
          file: ./byos-fastapi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
